<style>
*{box-sizing:border-box}html,body,#root{margin:0;padding:0;width:100%;min-height:100%}
body{background:#141416;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed}
::-webkit-scrollbar{display:none}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.18)}50%{box-shadow:0 0 0 8px rgba(255,255,255,0)}}
@keyframes categoryEnter{0%{opacity:0;transform:translateY(10px) scale(.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes categoryGlow{0%,100%{opacity:.35;transform:scaleX(.65)}50%{opacity:1;transform:scaleX(1)}}
@keyframes categoryLight{0%{left:-120%}100%{left:140%}}
@keyframes productEnter{0%{opacity:0;transform:translateY(15px) scale(.975)}100%{opacity:1;transform:translateY(0) scale(1)}}
.category-bar{background:transparent!important;background-color:transparent!important;box-shadow:none!important;backdrop-filter:none!important}
.luxury-bg{position:relative;isolation:isolate;overflow-x:hidden;background-image:radial-gradient(circle at 12% 8%,rgba(201,162,39,.12),transparent 28%),radial-gradient(circle at 88% 18%,rgba(255,255,255,.055),transparent 24%),linear-gradient(135deg,rgba(255,255,255,.018) 0%,transparent 38%,rgba(201,162,39,.035) 100%);}
.luxury-bg::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;background:radial-gradient(ellipse at center top,rgba(255,255,255,.035),transparent 48%),linear-gradient(115deg,transparent 0%,rgba(201,162,39,.025) 48%,transparent 100%);}
.luxury-bg::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:80px 80px;mask-image:linear-gradient(to bottom,black,transparent 70%);}
.luxury-bg .product-card{border:1px solid rgba(255,255,255,.075);box-shadow:0 12px 35px rgba(0,0,0,.20),0 1px 0 rgba(255,255,255,.035) inset!important;transition:transform .28s ease,box-shadow .28s ease,border-color .28s ease;}
.luxury-bg .product-card:hover{transform:translateY(-4px);box-shadow:0 18px 45px rgba(0,0,0,.28),0 0 0 1px rgba(201,162,39,.12) inset!important;border-color:rgba(201,162,39,.22);}
.luxury-bg .product-image{background-color:rgba(255,255,255,.025)!important;}
@media(max-width:640px){.luxury-bg::after{background-size:55px 55px;opacity:.12}.luxury-bg .product-card:hover{transform:none;}}
.category-scroll{display:flex;gap:9px;overflow-x:auto;overflow-y:hidden;padding:5px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-behavior:smooth;cursor:grab;overscroll-behavior-x:contain;touch-action:pan-x}.category-scroll:active{cursor:grabbing}
.category-chip{position:relative;flex-shrink:0;overflow:hidden;border:1px solid rgba(255,255,255,.10);border-radius:14px;padding:9px 15px;font-size:12px;font-weight:700;white-space:nowrap;transition:transform .28s cubic-bezier(.22,1,.36,1),background .28s ease,border-color .28s ease,box-shadow .28s ease,color .28s ease,opacity .28s ease;-webkit-tap-highlight-color:transparent;backdrop-filter:blur(12px)}
.category-chip::before{content:"";position:absolute;top:0;left:-120%;width:70%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.22),transparent);transform:skewX(-18deg);pointer-events:none}
.category-chip:hover::before{animation:categoryLight .65s ease forwards}
.category-chip:active{transform:scale(.94)}
.category-chip.active{transform:translateY(-2px);box-shadow:0 7px 20px rgba(0,0,0,.18),0 0 0 1px rgba(255,255,255,.08) inset}
.category-chip.active::after{content:"";position:absolute;left:22%;right:22%;bottom:2px;height:2px;border-radius:999px;background:rgba(255,255,255,.72);filter:blur(1px);animation:categoryGlow 2s ease-in-out infinite}
.product-card{position:relative;overflow:hidden;transform:translateZ(0);will-change:transform;animation:productEnter .45s cubic-bezier(.22,1,.36,1) both;transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s ease;-webkit-tap-highlight-color:transparent}
.product-card:active{transform:scale(.965) translateY(1px)}
.product-image{position:relative;overflow:hidden}
.product-image::after{content:"";position:absolute;top:0;left:-130%;width:70%;height:100%;background:linear-gradient(105deg,transparent 15%,rgba(255,255,255,.09) 48%,transparent 82%);transform:skewX(-15deg);pointer-events:none}
.product-card:hover .product-image::after{animation:categoryLight .8s ease forwards}
.search-input{width:100%;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.12);color:inherit;border-radius:14px;padding:12px 42px;outline:none;backdrop-filter:blur(14px)}
.admin-input{width:100%;background:#171717;border:1px solid #404040;color:#f5f5f5;border-radius:9px;padding:10px 12px;outline:none;font-size:13px}
.admin-input:focus{border-color:#737373}
textarea.admin-input{min-height:78px;resize:vertical}
.modal-backdrop{background:rgba(0,0,0,.78);backdrop-filter:blur(7px)}
.image-lightbox{background:rgba(8,8,10,.42);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.image-lightbox-card{width:min(88vw,760px);max-height:84vh;padding:10px;border:1px solid rgba(255,255,255,.14);border-radius:24px;background:rgba(24,24,27,.82);box-shadow:0 24px 80px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.04) inset;display:flex;align-items:center;justify-content:center}
.image-lightbox-card img{display:block;width:auto;height:auto;max-width:100%;max-height:78vh;object-fit:contain;border-radius:17px}
.price-row{border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.12)}

/* RESPONSIVE / MOBILE / TABLET / DESKTOP */
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-width:320px;overscroll-behavior-x:none;touch-action:pan-y}
button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
.safe-top{padding-top:env(safe-area-inset-top)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:640px){
  .product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .product-image{min-height:210px}
}
@media(min-width:1024px){
  .product-grid{grid-template-columns:repeat(4,minmax(0,1fr));max-width:1200px}
  .category-scroll,.max-w-5xl{max-width:1200px}
  .product-card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.20)!important}
  .product-image{min-height:230px}
}
@media(max-width:639px){
  .product-grid{gap:10px;padding-left:12px!important;padding-right:12px!important}
  .category-scroll{gap:7px;padding-left:2px;padding-right:2px}
  .category-chip{padding:9px 12px;font-size:11px;border-radius:13px}
  .product-card{border-radius:16px}
  .product-card .p-3{padding:10px}
  .product-card .font-semibold{font-size:12px}
  .product-card .product-image{height:clamp(150px,42vw,210px)!important}
  header{padding-left:14px!important;padding-right:14px!important}
  header img{max-width:58vw!important}
  .image-lightbox{padding:10px!important}
  .image-lightbox-card{width:96vw;max-height:88vh;padding:6px;border-radius:18px}
  .image-lightbox-card img{max-height:82vh;border-radius:13px}
}
@media(max-width:420px){
  .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .product-card .product-image{height:clamp(132px,39vw,175px)!important}
  .product-card .p-3{padding:9px}
  .product-card .text-\[13px\]{font-size:12px}
  .product-card .text-\[9px\]{font-size:8px}
}
@media(max-width:360px){
  .product-grid{gap:7px;padding-left:8px!important;padding-right:8px!important}
  .category-chip{padding:8px 10px;font-size:10px}
  .product-card .product-image{height:128px!important}
}
@media(min-width:640px) and (max-width:1023px){
  .product-grid{padding-left:18px!important;padding-right:18px!important;gap:14px}
  .category-scroll{padding-left:4px;padding-right:4px}
}
/* Admin panel: full width on phones, comfortable drawer on tablets/desktops */
@media(max-width:639px){
  .admin-panel-scroll{width:100%!important;max-width:none!important}
  .admin-panel-scroll .px-5{padding-left:14px!important;padding-right:14px!important}
  .admin-panel-scroll .grid.grid-cols-2{grid-template-columns:1fr!important}
  .admin-panel-scroll .grid.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .admin-panel-scroll .grid.grid-cols-\[1fr_105px_auto\]{grid-template-columns:minmax(0,1fr) 88px auto!important}
  .admin-panel-scroll input,.admin-panel-scroll textarea{font-size:16px!important;min-height:44px}
  .admin-panel-scroll textarea{min-height:96px}
  .admin-panel-scroll button{min-height:42px}
}
@media(min-width:640px){
  .admin-panel-scroll{width:min(520px,92vw)!important}
}
/* Prevent iOS Safari input zoom and horizontal overflow */
@supports (-webkit-touch-callout:none){
  input,textarea,select{font-size:16px}
}

/* LUXURY ANIMATED BACKGROUND - VISUAL ONLY */
body{position:relative;background:#0b0c0f!important;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;z-index:-3;pointer-events:none;background:radial-gradient(circle at 18% 18%,rgba(212,175,55,.13),transparent 24%),radial-gradient(circle at 82% 28%,rgba(255,255,255,.055),transparent 22%),radial-gradient(circle at 52% 88%,rgba(212,175,55,.08),transparent 28%),linear-gradient(135deg,#08090b 0%,#14151a 48%,#090a0c 100%);animation:luxuryDrift 18s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.24;background-image:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.035) 42%,transparent 55%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:100% 100%,70px 70px,70px 70px;mask-image:radial-gradient(ellipse at center,#000 25%,transparent 82%);animation:luxuryShimmer 14s linear infinite}
#root{position:relative;isolation:isolate}
#root::before,#root::after{content:"";position:fixed;pointer-events:none;border-radius:999px;filter:blur(60px);z-index:-1}
#root::before{width:260px;height:260px;left:-110px;top:28%;background:rgba(212,175,55,.08);animation:orbFloat1 12s ease-in-out infinite}
#root::after{width:320px;height:320px;right:-150px;top:58%;background:rgba(255,255,255,.035);animation:orbFloat2 16s ease-in-out infinite}
.product-card{position:relative;overflow:hidden;border-color:rgba(212,175,55,.13)!important;box-shadow:0 10px 35px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035)!important;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .45s}
.product-card::before{content:"";position:absolute;inset:-120% 35% -120% -35%;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.10) 48%,rgba(212,175,55,.08) 51%,transparent 63%);transform:translateX(-65%) rotate(8deg);pointer-events:none;z-index:2;transition:transform 1.2s ease}
.product-card:hover::before{transform:translateX(115%) rotate(8deg)}
.product-card:hover{transform:translateY(-6px) scale(1.008);border-color:rgba(212,175,55,.32)!important;box-shadow:0 22px 55px rgba(0,0,0,.34),0 0 30px rgba(212,175,55,.06),inset 0 1px 0 rgba(255,255,255,.06)!important}
.category-chip{transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease,background .3s ease}
.category-chip:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.10)}
header{animation:luxuryEnter 1s cubic-bezier(.2,.75,.2,1) both}
@keyframes luxuryDrift{0%{transform:translate3d(-1.5%,-1%,0) scale(1)}50%{transform:translate3d(1%,1.5%,0) scale(1.035)}100%{transform:translate3d(-.5%,2%,0) scale(1.02)}}
@keyframes luxuryShimmer{0%{background-position:0 0,0 0,0 0}100%{background-position:100% 0,70px 70px,-70px 70px}}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,-45px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,50px)}}
@keyframes luxuryEnter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){body::before,body::after,#root::before,#root::after,header,.product-card::before{animation:none!important}.product-card,.category-chip{transition:none!important}}
@media(max-width:639px){body::after{opacity:.14}.product-card:hover{transform:none}.product-card::before{display:none}}

</style>

const IDB_NAME="ofischi_premium_storage_v2";
const IDB_STORE="catalog";
const IDB_KEY="catalog";

function openCatalogDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error("IndexedDB desteklenmiyor"));return;}
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error("IndexedDB açılamadı"));
  });
}

function makeStorageRecord(data){
  return{savedAt:Date.now(),data:normalizeData(data)};
}

function parseStorageRecord(value){
  if(!value||typeof value!=="object")return null;
  /* Yeni format */
  if(value.data&&typeof value.data==="object")return{savedAt:Number(value.savedAt)||0,data:normalizeData(value.data)};
  /* Eski v4 formatıyla geriye dönük uyumluluk */
  return{savedAt:1,data:normalizeData(value)};
}

function readLocalRecord(key){
  try{
    const raw=localStorage.getItem(key);
    if(!raw)return null;
    return parseStorageRecord(JSON.parse(raw));
  }catch(e){
    console.warn("localStorage okunamadı:",e);
    return null;
  }
}

async function idbGetRecord(){
  const db=await openCatalogDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,"readonly");
    const req=tx.objectStore(IDB_STORE).get(IDB_KEY);
    req.onsuccess=()=>resolve(parseStorageRecord(req.result));
    req.onerror=()=>reject(req.error||new Error("IndexedDB okuma hatası"));
    tx.oncomplete=()=>db.close();
    tx.onerror=()=>reject(tx.error||new Error("IndexedDB işlem hatası"));
  });
}

async function idbSetRecord(record){
  const db=await openCatalogDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(record,IDB_KEY);
    tx.oncomplete=()=>{db.close();resolve(true)};
    tx.onerror=()=>{db.close();reject(tx.error||new Error("IndexedDB yazma hatası"))};
    tx.onabort=()=>{db.close();reject(tx.error||new Error("IndexedDB yazma iptal edildi"))};
  });
}

async function loadLocal(){
  const local=readLocalRecord(DB_KEY);
  const backup=readLocalRecord(BACKUP_KEY);
  let idb=null;
  try{idb=await idbGetRecord()}catch(e){console.warn("IndexedDB okunamadı:",e)}

  const candidates=[local,backup,idb].filter(Boolean);
  if(!candidates.length)return null;
  candidates.sort((a,b)=>(Number(b.savedAt)||0)-(Number(a.savedAt)||0));
  const newest=candidates[0];

  /* En güncel kopyayı diğer katmanlara da senkronla. */
  try{
    const json=JSON.stringify(newest);
    localStorage.setItem(DB_KEY,json);
    localStorage.setItem(BACKUP_KEY,json);
  }catch(e){}
  try{await idbSetRecord(newest)}catch(e){}

  return normalizeData(newest.data);
}

async function saveLocal(data){
  const clean=normalizeData(data);
  const record=makeStorageRecord(clean);
  const json=JSON.stringify(record);
  let localOk=false,idbOk=false;

  try{
    localStorage.setItem(DB_KEY,json);
    localStorage.setItem(BACKUP_KEY,json);
    /* Yazmayı hemen geri okuyarak gerçekten kaydedildiğini doğrula. */
    const check=readLocalRecord(DB_KEY);
    localOk=!!check&&check.savedAt===record.savedAt;
  }catch(e){console.warn("localStorage yazılamadı:",e)}

  try{
    await idbSetRecord(record);
    const check=await idbGetRecord();
    idbOk=!!check&&check.savedAt===record.savedAt;
  }catch(e){console.warn("IndexedDB yazılamadı:",e)}

  if(!localOk&&!idbOk)throw new Error("Tarayıcı depolamasına yazılamadı");
  return clean;
}

function getCurrencyByData(source){
 const id=source?.currency?.selected||"TRY";
 return CURRENCIES.find(x=>x.id===id)||CURRENCIES[0];
}
function convertPriceByData(source,amount){
 if(amount===null||amount===undefined||amount==="")return null;
 const n=Number(amount),c=source?.currency?.selected||"TRY";
 if(!Number.isFinite(n))return null;
 if(c==="USD"){const r=Number(source?.currency?.usdRate);return r>0?n/r:null}
 if(c==="EUR"){const r=Number(source?.currency?.eurRate);return r>0?n/r:null}
 return n;
}
function formatAmountByData(source,amount){
 const v=convertPriceByData(source,amount);if(v===null)return null;
 const c=getCurrencyByData(source),d=c.id==="TRY"?0:2;
 const locale=c.id==="TRY"?"tr-TR":"en-US";
 const s=v.toLocaleString(locale,{minimumFractionDigits:d,maximumFractionDigits:d});
 return c.id==="USD"?"$"+s:c.id==="EUR"?"€"+s:s+" ₺";
}

/* -------------------- PDF PRICE LIST -------------------- */
/*
   PDF LAYOUT — ORIGINAL OFISCHI GRID
   A4 portrait, fixed x coordinates, one identical product template.
   The original reference uses compact stacked product blocks on page 2;
   this implementation keeps that logic while removing KG / M³ as requested.
*/
function pdfText(lang,tr,en,fallback){return getText(lang,tr,en,fallback||tr)}
function pdfCurrencyInfo(data){
 const id=data?.currency?.selected||"TRY";
 const rate=id==="USD"?Number(data?.currency?.usdRate):id==="EUR"?Number(data?.currency?.eurRate):1;
 return {id,rate:rate>0?rate:1};
}
function pdfMoney(data,amount){
 if(amount===null||amount===undefined||amount===""||!Number.isFinite(Number(amount)))return "—";
 return formatAmountByData(data,amount)||"—";
}
function pdfTotal(data,item){
 const p=normalizePrice(item?.price);
 if(p.parts.length){
   const n=p.parts.filter(x=>!x.contactOnly&&x.amount!==null&&x.amount!==undefined&&x.amount!=="").reduce((a,x)=>a+Number(x.amount),0);
   return n>0?pdfMoney(data,n):(p.parts.some(x=>x.contactOnly)?(data?.currency?.selected==="TRY"?"İletişime geçin":"Contact us"):"—");
 }
 return p.contactOnly?(data?.currency?.selected==="TRY"?"İletişime geçin":"Contact us"):pdfMoney(data,p.amount);
}
function pdfCleanDims(value){return String(value||"—").replace(/\b(kg|m³|m3)\b/gi,"").replace(/\s{2,}/g," ").trim()||"—"}
function pdfDimsParts(value){
 const s=pdfCleanDims(value),nums=s.match(/[-+]?\d+(?:[.,]\d+)?/g)||[];
 return [nums[0]||"—",nums[1]||"—",nums[2]||"—"];
}
function pdfRowsForItem(item){
 const p=normalizePrice(item?.price);
 if(p.parts.length)return p.parts;
 return [{name:item?.name||"",name_en:item?.name_en||"",dims:item?.dims||"",dims_en:item?.dims_en||"",amount:p.amount,contactOnly:p.contactOnly}];
}

/* -------------------- STRICT PDF DATA / IMAGE BOUNDARIES -------------------- */
function pdfImageSource(value){
 if(typeof value==="string")return value.trim();
 if(value&&typeof value==="object")return String(value.src||value.data||value.url||"").trim();
 return "";
}
function pdfValidProductId(item){
 const id=item?.id;
 return (typeof id==="string"&&id.trim().length>=4)||(typeof id==="number"&&Number.isFinite(id));
}
function pdfHasRealProductData(item){
 if(!item||typeof item!=="object")return false;
 const price=item.price;
 const hasPrice=!!price&&(
   (Array.isArray(price.parts)&&price.parts.some(p=>p&&((p.amount!==null&&p.amount!==undefined&&p.amount!=="")||String(p.name??"").trim()))) ||
   (price.amount!==null&&price.amount!==undefined&&price.amount!=="")
 );
 return !!pdfImageSource(item.image)||!!String(item.dims??"").trim()||!!String(item.desc??"").trim()||hasPrice;
}
function pdfIsDemoProduct(item){
 if(!item||typeof item!=="object")return true;
 if(!pdfValidProductId(item))return true;
 if(item.isDemo===true||item.placeholder===true||item.temporary===true)return true;
 const name=String(item.name??"").trim();
 if(!name)return true;
 /* Only an empty legacy placeholder named Yeni Ürün/New Product is removed. */
 if(/^(yeni\s*ürün|new\s*product)$/i.test(name)&&!pdfHasRealProductData(item))return true;
 return false;
}
function pdfProductImageSource(item,data){
 const src=pdfImageSource(item?.image);
 if(!src)return "";
 /* Product image can ONLY come from this exact item's image field. */
 const logo=pdfImageSource(data?.logo?.src);
 if(logo&&src===logo)return "";
 for(const category of (data?.categories||[])){
   const cover=pdfImageSource(category?.coverImage);
   if(cover&&src===cover)return "";
 }
 return src;
}
function pdfRealCategories(rawData){
 const source=rawData&&typeof rawData==="object"?rawData:{};
 const categories=Array.isArray(source.categories)?source.categories:[];
 return categories.map(category=>{
   if(!category||typeof category!=="object")return null;
   const rawItems=Array.isArray(category.items)?category.items:[];
   const items=rawItems.filter(item=>!pdfIsDemoProduct(item)).map(item=>{
     const normalized=normalizeItem(item);
     /* One PDF product = one source item. No fields are borrowed from another item. */
     return {
       ...normalized,
       id:item.id,
       categoryId:category.id,
       categoryName:category.name,
       categoryName_en:category.name_en,
       image:pdfProductImageSource(item,source)||null
     };
   });
   return {...category,items};
 }).filter(Boolean).filter(category=>category.items.length>0);
}
async function pdfPrepareImages(data){
 const prepared=pdfRealCategories(data),images=new Map();
 for(const category of prepared){
   for(const item of category.items){
     const src=pdfProductImageSource(item,data);
     if(src&&!images.has(src))images.set(src,null);
   }
 }
 await Promise.all([...images.keys()].map(async src=>images.set(src,await pdfImageAsset(src))));
 return {data:{...data,categories:prepared},images};
}

async function buildPriceListPDF(rawData,lang){
 const source=normalizeData(rawData),currency=source.currency?.selected||"TRY";
 const pdfLang=currency==="TRY"?"TR":"EN";
 /* 1 currency/language  2 existing rates  3 real products  4 demo filter  5 images  6 layout */
 const prepared=await pdfPrepareImages(source),data=prepared.data,preparedImages=prepared.images;
 const pages=[await renderPdfCoverPage(data,pdfLang)];
 const L=PDF_LAYOUT,H=L.H,TOP=L.top,BOTTOM=L.bottom,GAP=L.gap,MAX_PRODUCTS=6;
 let current=[],used=TOP,productCount=0,currentCategoryId=null;
 const flush=async()=>{
   if(!current.length)return;
   pages.push(await renderPdfCatalogPage(data,pdfLang,current,pages.length+1,preparedImages));
   current=[];used=TOP;productCount=0;currentCategoryId=null;
 };
 const fits=h=>used+h<=H-BOTTOM;
 for(const category of (data.categories||[])){
   const items=Array.isArray(category.items)?category.items:[];
   if(!items.length)continue;
   const useCover=!!(data.pdf?.useCategoryCovers&&category.coverImage);
   if(useCover){
     pages.push(await renderPdfCategoryCoverPage(data,pdfLang,category,pages.length+1));
   }
   let headerNeed=L.categoryH+GAP;
   if(current.length&&(!fits(headerNeed+pdfCardHeight(items[0]))||productCount>=MAX_PRODUCTS))await flush();
   if(!fits(L.categoryH+GAP)&&current.length)await flush();
   current.push({type:"category",category});used+=L.categoryH+GAP;currentCategoryId=category.id;
   for(const item of items){
     const h=pdfCardHeight(item);
     if(productCount>=MAX_PRODUCTS||!fits(h)){
       await flush();
       current.push({type:"category",category});used+=L.categoryH+GAP;currentCategoryId=category.id;
     }
     current.push({type:"product",category,item});used+=h+GAP;productCount++;
   }
 }
 await flush();
 return await pdfCreateVectorDocument(pages);
}

 for(let i=0;i<objs.length;i++){const head=pdfObjBytes(`${i+1} 0 obj\n`),tail=pdfObjBytes("\nendobj\n");offsets[i+1]=pos;parts.push(head,objs[i],tail);pos+=head.length+objs[i].length+tail.length}

async function pdfLogoToTransparentDataURL(file){
  if(!file||!file.type.startsWith("image/"))throw new Error("Geçersiz logo");
  if(file.type.includes("svg")){return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result));r.onerror=()=>reject(r.error);r.readAsDataURL(file)})}
  const raw=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(r.error);r.readAsDataURL(file)});
  const img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error("Logo açılamadı"));im.src=raw});
  const max=1800,scale=Math.min(1,max/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));
  const c=document.createElement("canvas");c.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));c.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));
  const ctx=c.getContext("2d",{willReadFrequently:true});ctx.drawImage(img,0,0,c.width,c.height);
  const d=ctx.getImageData(0,0,c.width,c.height),px=d.data;
  for(let i=0;i<px.length;i+=4){const r=px[i],g=px[i+1],b=px[i+2],a=px[i+3];const min=Math.min(r,g,b),maxc=Math.max(r,g,b);if(a>0&&min>238&&maxc-min<18)px[i+3]=0;else if(a>0&&min>220&&maxc-min<22)px[i+3]=Math.round(a*((255-min)/35));}
  ctx.putImageData(d,0,0);return c.toDataURL("image/png");
}

async function fileToOptimizedDataURL(file,maxSize=1800,quality=.82){
  if(!file||!file.type.startsWith("image/"))throw new Error("Geçersiz görsel");
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error||new Error("Dosya okunamadı"));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Görsel açılamadı"));
      img.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale));
        const h=Math.max(1,Math.round(img.naturalHeight*scale));
        const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* Price components must never remain Turkish in EN mode. Use the same
   deterministic catalog translator as the admin translation tools. */
const exactPart={
"ETAJERLİ MASA":"DESK WITH RETURN",
"DOLAP":"CABINET",
"SEHPA":"COFFEE TABLE",
"ÜNİTE":"UNIT",
"MASA":"DESK",
"ETAJER":"RETURN"
};
const key=String(p.name||"").trim().toLocaleUpperCase("tr-TR");
return exactPart[key]||p.name||"";
};

</button>

{currencyMenuOpen&&<div className="absolute right-0 mt-2 w-36 rounded-2xl overflow-hidden shadow-2xl border" style={{background:theme.card,borderColor:theme.text+"18",zIndex:1000}}>
<div className="px-3 py-2 text-[9px] uppercase tracking-widest font-bold opacity-40 border-b">{t(language,"currency")}</div>

<span className="flex items-center gap-2"><span className="w-8 h-8 rounded-full flex items-center justify-center font-bold" style={{background:currency.id===c.id?theme.accent:theme.accent+"18",color:currency.id===c.id?"#fff":theme.accent}}>{c.symbol}</span><span>{c.name}</span></span>{currency.id===c.id&&<Icon type="check" size={15}/>}
</button>)}</div>}
</div>

<button onClick={()=>setSearch(search?"":" ")} className="w-10 h-10 rounded-full flex items-center justify-center" style={{background:"rgba(0,0,0,.25)",backdropFilter:"blur(15px)",color:theme.text}}><Icon type="search" size={18}/></button>
</div></div>

{search!==""&&<div className="fixed top-[68px] left-4 right-4 z-40"><div className="max-w-5xl mx-auto relative"><input autoFocus value={search.trim()} onChange={e=>setSearch(e.target.value)} placeholder={t(language,"search")} className="search-input" style={{color:theme.text}}/></div></div>}

{!search.trim()&&<div className="sticky top-[64px] z-20 px-4 pt-3 pb-2 category-bar"><div className="max-w-5xl mx-auto category-scroll" onWheel={e=>{const el=e.currentTarget;if(el.scrollWidth>el.clientWidth&&Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();el.scrollLeft+=e.deltaY}}} onMouseDown={e=>{const el=e.currentTarget;el.dataset.dragging="1";el.dataset.dragStartX=String(e.clientX);el.dataset.dragStartScroll=String(el.scrollLeft)}} onMouseMove={e=>{const el=e.currentTarget;if(el.dataset.dragging==="1"){el.scrollLeft=Number(el.dataset.dragStartScroll)-(e.clientX-Number(el.dataset.dragStartX))}}} onMouseUp={e=>{e.currentTarget.dataset.dragging="0"}} onMouseLeave={e=>{e.currentTarget.dataset.dragging="0"}}>{categories.map((category,index)=>{const active=category.id===activeCat;return <button key={category.id} onClick={()=>{setActiveCat(category.id);setOpenCategories({})}} className={"category-chip "+(active?"active":"")} style={{background:active?`linear-gradient(135deg,${theme.accent},${theme.accent}dd)`:`${theme.accent}14`,color:active?"#fff":theme.text,borderColor:active?theme.accent+"70":theme.text+"12",opacity:active?1:.78,boxShadow:active?`0 6px 18px ${theme.accent}30`:"none",animation:`categoryEnter .4s cubic-bezier(.22,1,.36,1) ${index*45}ms both`}}>{categoryDisplay(category)}</button>})}</div></div>}

{data.phone&&<a href={"tel:"+data.phone.replace(/\s/g,"")} className="mt-5 w-full py-3.5 rounded-xl flex items-center justify-center gap-2 font-bold text-sm" style={{background:theme.accent,color:"#fff"}}><Icon type="phone" size={16}/>{t(language,"call")}</a>}
</div></div></div>}

{fullScreenImage&&<div className="fixed inset-0 z-[300] image-lightbox flex items-center justify-center p-5 sm:p-8" onClick={()=>setFullScreenImage(null)}><div className="image-lightbox-card relative" onClick={e=>e.stopPropagation()}><img src={fullScreenImage} alt="Ürün fotoğrafı"/><button onClick={()=>setFullScreenImage(null)} className="absolute -top-3 -right-3 w-10 h-10 rounded-full flex items-center justify-center border border-white/15 shadow-xl" style={{background:"rgba(25,25,28,.94)",color:"#fff"}}><Icon type="x" size={19}/></button></div></div>}
{supabaseLogin&&<div className="fixed inset-0 z-[210] bg-black/80 flex items-center justify-center p-4"><div className="w-full max-w-sm bg-neutral-950 border border-neutral-800 rounded-2xl p-6"><h2 className="font-bold text-white mb-4">Supabase Yönetici Girişi</h2><input type="email" value={sbEmail} onChange={e=>setSbEmail(e.target.value)} placeholder="E-posta" className="admin-input mb-3"/><input type="password" value={sbPassword} onChange={e=>setSbPassword(e.target.value)} placeholder="Şifre" className="admin-input mb-4" onKeyDown={e=>e.key==="Enter"&&loginSupabase()}/><div className="flex gap-2"><button onClick={()=>{setSupabaseLogin(false);setSbPassword("")}} className="flex-1 py-2.5 bg-neutral-800 rounded-lg text-sm text-neutral-300">Vazgeç</button><button onClick={loginSupabase} disabled={sbBusy} className="flex-1 py-2.5 rounded-lg text-sm font-bold text-white disabled:opacity-50" style={{background:theme.accent}}>{sbBusy?"Giriş…":"Giriş Yap"}</button></div></div></div>}
{pinModal&&<div className="fixed inset-0 z-[200] bg-black/75 flex items-center justify-center p-4"><div className="w-full max-w-xs bg-neutral-950 border border-neutral-800 rounded-2xl p-6"><div className="flex items-center gap-2 mb-4 text-white"><Icon type="lock" size={18}/><h2 className="font-bold">{t("TR","admin")}</h2></div><input autoFocus type="password" inputMode="numeric" maxLength="8" value={pinInput} onChange={e=>{setPinInput(e.target.value.replace(/\D/g,""));setPinError(false)}} onKeyDown={e=>e.key==="Enter"&&tryUnlock()} placeholder="PIN" className="admin-input tracking-[.3em]"/>{pinError&&<div className="text-xs text-red-400 mt-2">{t("TR","wrongPin")}</div>}<div className="text-[11px] text-neutral-500 mt-2 mb-4">Varsayılan PIN: 1234</div><div className="flex gap-2"><button onClick={()=>setPinModal(false)} className="flex-1 py-2.5 bg-neutral-800 rounded-lg text-sm text-neutral-300">{t("TR","cancel")}</button><button onClick={tryUnlock} className="flex-1 py-2.5 rounded-lg text-sm font-bold text-white" style={{background:theme.accent}}>{t("TR","login")}</button></div></div></div>}

{categories.map((category,categoryIndex)=><div key={category.id} className="bg-neutral-900 border border-neutral-800 rounded-xl mb-3 overflow-hidden">
<div className="p-2 flex items-center gap-1.5">
<input value={category.name} onChange={e=>renameCategory(category.id,e.target.value)} className="admin-input" style={{padding:"9px 10px",fontSize:"13px"}}/>
<button onClick={()=>moveCategory(category.id,-1)} disabled={categoryIndex===0} className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"><Icon type="up" size={14}/></button>
<button onClick={()=>moveCategory(category.id,1)} disabled={categoryIndex===categories.length-1} className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"><Icon type="down" size={14}/></button>
<button onClick={()=>deleteCategory(category.id)} className="p-2 bg-red-950 text-red-400 rounded-lg"><Icon type="trash" size={14}/></button>
<button onClick={()=>toggleCategory(category.id)} className="px-3 py-2 rounded-lg text-[11px] whitespace-nowrap flex items-center gap-1.5 font-semibold" style={{background:openCategories[category.id]?theme.accent:"#262626",color:openCategories[category.id]?"#fff":"#aaa"}}>{t("TR","productsBtn")}<Icon type={openCategories[category.id]?"up":"down"} size={13}/></button>
</div>

{openCategories[category.id]&&<div className="p-2 pt-0">
{category.items.length===0&&<div className="bg-neutral-800 rounded-xl p-4 mb-2 text-center text-xs text-neutral-500">Bu kategoride henüz ürün yok.</div>}
{category.items.map((item,itemIndex)=><div key={item.id} className="bg-neutral-800 rounded-xl p-3 mb-2">
<div className="flex gap-2 mb-2">
<div className="w-16 h-16 rounded-lg bg-neutral-700 flex-shrink-0 overflow-hidden flex items-center justify-center" style={{backgroundImage:item.image?`url(${item.image})`:undefined,backgroundSize:"cover",backgroundPosition:"center"}}>{!item.image&&<Icon type="image" size={18}/>}</div>
<div className="flex flex-col gap-1 flex-shrink-0">
<button type="button" onClick={()=>document.getElementById("product-image-"+category.id+"-"+item.id)?.click()} className="px-2.5 py-1.5 rounded-lg bg-neutral-700 border border-neutral-600 text-[10px] font-bold flex items-center gap-1"><Icon type="upload" size={12}/>Fotoğraf</button>
{item.image&&<button type="button" onClick={()=>removeProductImage(category.id,item.id)} className="px-2.5 py-1.5 rounded-lg bg-red-950 text-red-400 text-[10px] font-bold">Sil</button>}
<input id={"product-image-"+category.id+"-"+item.id} type="file" accept="image/*" className="hidden" onChange={e=>uploadProductImage(category.id,item.id,e)}/>
</div>
<div className="flex-1 grid gap-2">
<div>
<input value={item.name} onChange={e=>editTurkishField(category.id,item,"name",e.target.value)} placeholder="Ürün adı" className="admin-input" style={{padding:"8px 9px",fontSize:"12px"}}/>
</div>
<div>
<input value={item.dims} onChange={e=>{const v=e.target.value;updateItem(category.id,item.id,"dims",v);updateItem(category.id,item.id,"dims_en",v)}} placeholder={t("TR","dimsPlaceholder")} className="admin-input" style={{padding:"8px 9px",fontSize:"12px"}}/>
</div>
</div></div>

<div className="mb-2">
<textarea value={item.desc} onChange={e=>editTurkishField(category.id,item,"desc",e.target.value)} placeholder={t("TR","description")} className="admin-input"/>
</div>

<div className="rounded-xl border border-neutral-700 bg-neutral-900 p-3 mb-2">
<div className="flex items-center justify-between mb-3"><div><div className="text-[10px] uppercase tracking-widest font-bold" style={{color:theme.accent}}>{t("TR","parts")}</div><div className="text-[9px] text-neutral-500 mt-1">{t("TR","partHint")}</div></div><button onClick={()=>addPricePart(category.id,item.id)} className="px-3 py-1.5 rounded-lg text-[10px] font-bold text-white flex items-center gap-1" style={{background:theme.accent}}><Icon type="plus" size={12}/>{t("TR","addPrice")}</button></div>
{normalizePrice(item.price).parts.length===0&&<div className="text-[10px] text-neutral-500 py-2 text-center">Henüz fiyat kalemi eklenmedi.</div>}
{normalizePrice(item.price).parts.map(part=><div key={part.id} className="bg-neutral-800 rounded-lg p-2 mb-2">
<div className="mb-2">
<input value={part.name} onChange={e=>updatePricePart(category.id,item.id,part.id,"name",e.target.value)} placeholder="Parça adı" className="admin-input" style={{padding:"8px",fontSize:"11px"}}/>
</div>
<div className="grid grid-cols-[1fr_105px_auto] gap-2 items-center">
<input value={part.dims||""} onChange={e=>{const v=e.target.value;updatePricePart(category.id,item.id,part.id,"dims",v);updatePricePart(category.id,item.id,part.id,"dims_en",v)}} placeholder="Ölçü" className="admin-input" style={{padding:"8px",fontSize:"11px"}}/>
<input type="number" value={part.amount??""} disabled={part.contactOnly} onChange={e=>updatePricePart(category.id,item.id,part.id,"amount",e.target.value===""?null:Number(e.target.value))} placeholder="₺" className="admin-input" style={{padding:"8px",fontSize:"11px",opacity:part.contactOnly?.4:1}}/>
<button onClick={()=>deletePricePart(category.id,item.id,part.id)} className="px-2 py-2 bg-red-950 text-red-400 rounded-lg"><Icon type="trash" size={13}/></button>
</div>
<label className="flex items-center gap-2 mt-2 text-[10px] text-neutral-400"><input type="checkbox" checked={!!part.contactOnly} onChange={e=>updatePricePart(category.id,item.id,part.id,"contactOnly",e.target.checked)}/>{t("TR","contactOnly")}</label>
</div>)}
</div>

<div className="flex justify-end gap-1">
<button onClick={()=>moveItem(category.id,item.id,-1)} disabled={itemIndex===0} className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"><Icon type="up" size={12}/></button>
<button onClick={()=>moveItem(category.id,item.id,1)} disabled={itemIndex===category.items.length-1} className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"><Icon type="down" size={12}/></button>
<button onClick={()=>deleteItem(category.id,item.id)} className="p-1.5 bg-red-950 text-red-400 rounded"><Icon type="trash" size={12}/></button>
</div>
</div>)}
<button onClick={()=>addItem(category.id)} className="w-full py-2.5 bg-neutral-700 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5"><Icon type="plus" size={14}/>{t("TR","addProduct")}</button>
</div>}
</div>)}
</div>
</div>


<div className={adminSection==="pdf"?"":"hidden"}>
<div className="mt-2 rounded-2xl border border-neutral-800 bg-neutral-900 p-4">
<div className="text-[10px] uppercase tracking-widest font-bold text-amber-500 mb-2">PDF Fiyat Listesi</div>
<div className="text-xs text-neutral-400 mb-4">Web sitesindeki kategori, ürün, görsel, ölçü, fiyat, dil ve para birimi sırası aynen PDF'ye aktarılır. KG ve M³ kullanılmaz.</div>
<div className="grid grid-cols-2 gap-2 mb-4">
<button onClick={()=>createPDF(false)} disabled={pdfBusy} className="py-3 rounded-xl text-xs font-bold text-white flex items-center justify-center gap-2 disabled:opacity-50" style={{background:theme.accent}}><Icon type="download" size={14}/>{pdfBusy?"Oluşturuluyor…":"PDF Oluştur"}</button>
<button onClick={()=>createPDF(true)} disabled={pdfBusy} className="py-3 rounded-xl text-xs font-bold bg-neutral-800 border border-neutral-700 flex items-center justify-center gap-2 disabled:opacity-50"><Icon type="image" size={14}/>PDF Önizle</button>
</div>
<div className="grid grid-cols-2 gap-3 mb-4">
<label><AdminLabel>PDF Başlığı</AdminLabel><input className="admin-input" value={data.pdf?.title||""} onChange={e=>setPath(["pdf","title"],e.target.value)}/></label>
<label><AdminLabel>Web Sitesi</AdminLabel><input className="admin-input" value={data.pdf?.website||""} onChange={e=>setPath(["pdf","website"],e.target.value)}/></label>
</div>
<label className="block mb-4"><AdminLabel>PDF Alt Bilgisi</AdminLabel><input className="admin-input" value={data.pdf?.footer||""} onChange={e=>setPath(["pdf","footer"],e.target.value)}/></label>
<label className="flex items-center gap-2 text-xs text-neutral-300 mb-5"><input type="checkbox" checked={data.pdf?.showPageNumbers!==false} onChange={e=>setPath(["pdf","showPageNumbers"],e.target.checked)}/> Sayfa numarası göster</label>
<label className="flex items-center gap-2 text-xs text-neutral-300 mb-5"><input type="checkbox" checked={!!data.pdf?.useCategoryCovers} onChange={e=>setPath(["pdf","useCategoryCovers"],e.target.checked)}/> Kategori kapak görsellerini PDF'de tam sayfa kullan</label>
<div className="border-t border-neutral-800 pt-4 mb-5">
<div className="text-[10px] uppercase tracking-widest font-bold text-amber-500 mb-2">PDF Kapak Logosu</div>
<div className="text-[10px] text-neutral-500 mb-3">Bu logo PDF kapağında ve tüm kategori kapaklarında kullanılır. Web sitesindeki logo ve ürün görsellerinden bağımsızdır.</div>
<div className="h-32 rounded-lg bg-black border border-neutral-800 overflow-hidden flex items-center justify-center mb-3">{data.pdf?.coverLogo?.src?<img src={data.pdf.coverLogo.src} alt="PDF Kapak Logosu" className="max-w-[90%] max-h-[90%] object-contain"/>:<span className="text-[10px] text-neutral-600">PDF KAPAK LOGOSU EKLENMEDİ</span>}</div>
<div className="grid grid-cols-2 gap-2">
<button onClick={()=>document.getElementById("pdf-cover-logo-input")?.click()} className="py-2.5 rounded-lg bg-neutral-800 border border-neutral-700 text-[10px] font-bold">{data.pdf?.coverLogo?.src?"Logoyu Değiştir":"Logo Ekle"}</button>
<button disabled={!data.pdf?.coverLogo?.src} onClick={removePdfCoverLogo} className="py-2.5 rounded-lg bg-red-950 text-red-400 text-[10px] font-bold disabled:opacity-30">Logoyu Sil</button>
</div>
<input id="pdf-cover-logo-input" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" className="hidden" onChange={uploadPdfCoverLogo}/>
</div>
<div className="border-t border-neutral-800 pt-4">
<div className="text-[10px] uppercase tracking-widest font-bold text-amber-500 mb-3">Kategori Kapakları</div>
<div className="text-[10px] text-neutral-500 mb-3">Kapak görselleri ayrı tutulur. İstersen PDF içinde tam sayfa açmadan kompakt kategori bannerı olarak kullanılabilir.</div>
{categories.map(category=><div key={category.id} className="rounded-xl bg-neutral-950 border border-neutral-800 p-3 mb-3">
<div className="flex items-center justify-between gap-3 mb-3"><div className="font-semibold text-sm">{category.name}</div><div className="text-[10px] text-neutral-500">{category.items?.length||0} ürün</div></div>
<div className="h-28 rounded-lg bg-neutral-900 overflow-hidden flex items-center justify-center mb-3">{category.coverImage?<img src={category.coverImage} alt="Kapak" className="w-full h-full object-cover"/>:<span className="text-[10px] text-neutral-600">Kapak görseli yok</span>}</div>
<div className="grid grid-cols-3 gap-2">
<button onClick={()=>document.getElementById("cover-image-"+category.id)?.click()} className="py-2 rounded-lg bg-neutral-800 text-[10px] font-bold">{category.coverImage?"Değiştir":"Kapak Yükle"}</button>
<button disabled={!category.coverImage} onClick={()=>category.coverImage&&window.open(category.coverImage,"_blank")} className="py-2 rounded-lg bg-neutral-800 text-[10px] font-bold disabled:opacity-30">Önizle</button>
<button disabled={!category.coverImage} onClick={()=>removeCategoryCover(category.id)} className="py-2 rounded-lg bg-red-950 text-red-400 text-[10px] font-bold disabled:opacity-30">Sil</button>
</div>
<input id={"cover-image-"+category.id} type="file" accept="image/*" className="hidden" onChange={e=>uploadCategoryCover(category.id,e)}/>
</div>)}
</div>
</div>
</div>

<div className="sticky bottom-0 bg-neutral-950 border-t border-neutral-800 p-4"><button onClick={save} disabled={saving} className="w-full py-3.5 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 disabled:opacity-50" style={{background:saved?"#12B76A":theme.accent,animation:saved?"pop .3s ease":saving?"none":"pulse 2.2s infinite"}}>{saved?<Icon type="check" size={17}/>:<Icon type="save" size={17}/>} {saved?t("TR","saved"):saving?t("TR","saving"):t("TR","save")}</button></div></div>
</aside></div>}

</div>
}
const root=document.getElementById("root");
if(root)ReactDOM.createRoot(root).render(<App/>);
</script>
</body>
</html>
