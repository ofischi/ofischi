 {normalizePrice(item.price).parts.map(part=><div key={part.id} className="bg-neutral-800 rounded-lg p-2 mb-2"><div className="flex gap-2"><input value={part.name} onChange={e=>updatePricePart(category.id,item.id,part.id,"name",e.target.value)} placeholder="Örn: Masa" className="admin-input" style={{padding:"8px",fontSize:"11px"}}/><input type="number" value={part.amount??""} disabled={part.contactOnly} onChange={e=>updatePricePart(category.id,item.id,part.id,"amount",e.target.value===""?null:Number(e.target.value))} placeholder="₺" className="admin-input" style={{width:"105px",padding:"8px",fontSize:"11px",opacity:part.contactOnly?.4:1}}/><button onClick={()=>deletePricePart(category.id,item.id,part.id)} className="px-2 bg-red-950 text-red-400 rounded-lg"><Icon type="trash" size={13}/></button></div>
 <label className="flex items-center gap-2 mt-2 text-[10px] text-neutral-400"><input type="checkbox" checked={!!part.contactOnly} onChange={e=>updatePricePart(category.id,item.id,part.id,"contactOnly",e.target.checked)}/>Fiyat için iletişime geçin</label></div>)}</div>
 <div className="flex justify-end gap-1">{item.image&&<button onClick={()=>updateItem(category.id,item.id,"image",null)} className="px-2 py-1 bg-neutral-700 rounded text-[10px]">Görseli Sil</button>}<button onClick={()=>moveItem(category.id,item.id,-1)} disabled={itemIndex===0} className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"><Icon type="up" size={12}/></button><button onClick={()=>moveItem(category.id,item.id,1)} disabled={itemIndex===category.items.length-1} className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"><Icon type="down" size={12}/></button><button onClick={()=>deleteItem(category.id,item.id)} className="p-1.5 bg-red-950 text-red-400 rounded"><Icon type="trash" size={12}/></button></div>
 </div>)}
 <button onClick={()=>addItem(category.id)} className="w-full py-2.5 bg-neutral-700 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5"><Icon type="plus" size={14}/>Ürün Ekle</button></div>}
 </div>)}
 </div></div>
 <div className="sticky bottom-0 bg-neutral-950 border-t border-neutral-800 p-4"><button onClick={save} disabled={saving||busy} className="w-full py-3.5 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 disabled:opacity-50" style={{background:saved?"#12B76A":theme.accent,animation:saved?"pop .3s ease":saving?"none":"pulse 2.2s infinite"}}>{saved?<Icon type="check" size={17}/>:<Icon type="save" size={17}/>} {saved?"Kaydedildi!":saving?"Kaydediliyor...":"Kaydet ve Kapat"}</button></div>
 </aside></div>}
 </div>
}
const root=document.getElementById("root");if(root)ReactDOM.createRoot(root).render(<App/>);
</script></body></html>
