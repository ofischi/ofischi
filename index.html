*{box-sizing:border-box}html,body,#root{margin:0;padding:0;width:100%;min-height:100%;touch-action:manipulation}

:focus-visible{outline:2px solid #C9A227;outline-offset:2px;border-radius:10px}

/* Ana sayfada metin imleci (I-beam) görünmesini engelle; form alanları ve tıklanabilir öğeler normal davranır. */
.luxury-bg,.luxury-bg *{cursor:default;caret-color:transparent;-webkit-user-select:none;user-select:none}

::-webkit-scrollbar{display:none}

.product-card{position:relative;overflow:hidden;transform:translateZ(0);will-change:transform;animation:productEnter .45s cubic-bezier(.22,1,.36,1) both;transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s ease;-webkit-tap-highlight-color:transparent}
.product-card{content-visibility:auto;contain-intrinsic-size:0 420px}
.product-gallery-img,.detail-gallery-img{content-visibility:auto}

.gallery-arrow:hover,.detail-gallery-arrow:hover,.lightbox-nav:hover{background:rgba(10,10,12,.8);transform:translateY(-50%) scale(1.05)}
.gallery-dots,.detail-gallery-dots{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:flex;gap:5px;padding:5px 8px;border-radius:999px;background:rgba(10,10,12,.42);backdrop-filter:blur(8px);z-index:5}
.gallery-dot,.detail-gallery-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.55);transition:.25s}.gallery-dot.active,.detail-gallery-dot.active{width:18px;border-radius:5px;background:#fff}
.detail-gallery{position:relative;width:100%;height:270px;overflow:hidden;touch-action:pan-y;cursor:zoom-in}
.image-lightbox{background:rgba(8,8,10,.42);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.image-lightbox-card{max-width:min(96vw,1100px);max-height:92vh;position:relative;display:flex;align-items:center;justify-content:center}
.image-lightbox-card img{max-width:92vw;max-height:88vh;object-fit:contain;user-select:none;-webkit-user-drag:none}
.lightbox-count{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:5px 10px;border-radius:999px;background:rgba(10,10,12,.62);color:#fff;font-size:11px;z-index:6}

.product-image::after{content:"";position:absolute;top:0;left:-130%;width:70%;height:100%;background:linear-gradient(105deg,transparent 15%,rgba(255,255,255,.09) 48%,transparent 82%);transform:skewX(-15deg);pointer-events:none}
.product-card:hover .product-image::after{animation:categoryLight .8s ease forwards}
.search-input-icon{z-index:1;position:absolute;left:15px;top:50%;transform:translateY(-50%);opacity:.6;pointer-events:none}
.search-input::-webkit-search-cancel-button{display:none}
.search-input{width:100%;font-size:16px;background:rgba(0,0,0,.18);border:1px solid rgba(255,255,255,.12);color:inherit;border-radius:14px;padding:12px 42px;outline:none;backdrop-filter:blur(14px)}
.admin-input{width:100%;background:#171717;border:1px solid #404040;color:#f5f5f5;border-radius:9px;padding:10px 12px;outline:none;font-size:13px}
.admin-input:focus{border-color:#737373}
textarea.admin-input{min-height:78px;resize:vertical}
.modal-backdrop{background:rgba(0,0,0,.78);backdrop-filter:blur(7px)}
.image-lightbox{background:rgba(18,20,24,.20);backdrop-filter:blur(18px) saturate(115%);-webkit-backdrop-filter:blur(18px) saturate(115%);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.image-lightbox::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.035);pointer-events:none}
.image-lightbox-card{position:relative;width:auto;height:auto;max-width:94vw;max-height:92vh;padding:0;border:1px solid rgba(255,255,255,.16);border-radius:18px;background:rgba(255,255,255,.035);box-shadow:0 30px 90px rgba(0,0,0,.28),0 0 0 1px rgba(255,255,255,.04) inset;display:flex;align-items:center;justify-content:center;overflow:visible;touch-action:none}
.image-lightbox-card img{display:block;width:auto;height:auto;max-width:94vw;max-height:92vh;object-fit:contain;border-radius:17px;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;will-change:transform;transform-origin:center center;box-shadow:0 18px 55px rgba(0,0,0,.22)}
.image-lightbox-close{position:fixed;top:18px;right:18px;z-index:9999;width:46px;height:46px;border-radius:999px;border:1px solid rgba(255,255,255,.25);background:rgba(20,20,23,.34);color:#fff;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);box-shadow:0 10px 30px rgba(0,0,0,.18);transition:transform .2s ease,background .2s ease}

.image-lightbox-nav:hover{background:rgba(20,20,23,.48)}
.image-lightbox-nav.left{left:22px}.image-lightbox-nav.right{right:22px}
.image-lightbox-hint{display:none}
.image-lightbox .lightbox-count{top:14px;bottom:auto;left:50%;transform:translateX(-50%);z-index:9999;padding:7px 12px;border-radius:999px;background:rgba(20,20,23,.25);border:1px solid rgba(255,255,255,.12);color:rgba(255,255,255,.9);font-size:11px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.lightbox-count{position:absolute;left:50%;top:18px;bottom:auto;transform:translateX(-50%);padding:6px 11px;border-radius:999px;background:rgba(20,20,23,.60);border:1px solid rgba(255,255,255,.10);color:#fff;font-size:11px;z-index:15;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.price-row{border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.12)}

/* RESPONSIVE / MOBILE / TABLET / DESKTOP */
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-width:320px;overscroll-behavior-x:none;touch-action:pan-y}
button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
.safe-top{padding-top:env(safe-area-inset-top)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:640px){
  .product-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .product-image{min-height:210px}
}
@media(min-width:1024px){
  .product-grid{grid-template-columns:repeat(4,minmax(0,1fr));max-width:1200px}
  .category-scroll,.max-w-5xl{max-width:1200px}
  .product-card:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.20)!important}
  .product-image{min-height:230px}
}
@media(max-width:639px){
  .product-grid{gap:10px;padding-left:12px!important;padding-right:12px!important}
  .category-scroll{gap:7px;padding-left:2px;padding-right:2px}
  .category-chip{padding:9px 13px;font-size:12px;border-radius:13px}
  .product-card{border-radius:16px}
  .product-card .p-3{padding:10px}
  .product-card .font-semibold{font-size:12px}
  .product-card .product-image{height:clamp(150px,42vw,210px)!important}
  header{padding-left:14px!important;padding-right:14px!important}
  header img{max-width:58vw!important}
  .image-lightbox{padding:0!important}
  .image-lightbox-card{width:auto;height:auto;max-width:96vw;max-height:92vh;padding:0;border-radius:16px}
  .image-lightbox-card img{max-width:96vw;max-height:92vh;border-radius:15px}
  .image-lightbox-close{top:12px;right:12px;width:42px;height:42px}
  .image-lightbox-nav{width:42px;height:42px}
  .image-lightbox-nav.left{left:10px}.image-lightbox-nav.right{right:10px}
  .lightbox-count{top:12px}
}
@media(max-width:420px){
  .product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .product-card .product-image{height:clamp(132px,39vw,175px)!important}
  .product-card .p-3{padding:9px}
  .product-card .text-\[13px\]{font-size:12px}
  .product-card .text-\[9px\]{font-size:8px}
}
@media(max-width:360px){
  .product-grid{gap:7px;padding-left:8px!important;padding-right:8px!important}
  .category-chip{padding:8px 12px;font-size:12px}
  .product-card .product-image{height:128px!important}
}
@media(min-width:640px) and (max-width:1023px){
  .product-grid{padding-left:18px!important;padding-right:18px!important;gap:14px}
  .category-scroll{padding-left:4px;padding-right:4px}
}
/* Admin panel: full width on phones, comfortable drawer on tablets/desktops */
@media(max-width:639px){
  .admin-panel-scroll{width:100%!important;max-width:none!important}
  .admin-panel-scroll .px-5{padding-left:14px!important;padding-right:14px!important}
  .admin-panel-scroll .grid.grid-cols-2{grid-template-columns:1fr!important}
  .admin-panel-scroll .grid.grid-cols-3{grid-template-columns:repeat(3,minmax(0,1fr))!important}
  .admin-panel-scroll .grid.grid-cols-\[1fr_105px_auto\]{grid-template-columns:minmax(0,1fr) 88px auto!important}
  .admin-panel-scroll input,.admin-panel-scroll textarea{font-size:16px!important;min-height:44px}
  .admin-panel-scroll textarea{min-height:96px}
  .admin-panel-scroll button:not(.thumb-btn){min-height:42px}

@media(min-width:640px){
  .admin-panel-scroll{width:min(520px,92vw)!important}
}
/* Prevent iOS Safari input zoom and horizontal overflow */
@supports (-webkit-touch-callout:none){
  input,textarea,select{font-size:16px}
}

/* LUXURY ANIMATED BACKGROUND - VISUAL ONLY */
body{position:relative;background:#0b0c0f!important;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;z-index:-3;pointer-events:none;background:radial-gradient(circle at 18% 18%,rgba(212,175,55,.13),transparent 24%),radial-gradient(circle at 82% 28%,rgba(255,255,255,.055),transparent 22%),radial-gradient(circle at 52% 88%,rgba(212,175,55,.08),transparent 28%),linear-gradient(135deg,#08090b 0%,#14151a 48%,#090a0c 100%);animation:luxuryDrift 18s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.24;background-image:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.035) 42%,transparent 55%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:100% 100%,70px 70px,70px 70px;mask-image:radial-gradient(ellipse at center,#000 25%,transparent 82%);animation:luxuryShimmer 14s linear infinite}
#root{position:relative;isolation:isolate}
#root::before,#root::after{content:"";position:fixed;pointer-events:none;border-radius:999px;filter:blur(60px);z-index:-1}
#root::before{width:260px;height:260px;left:-110px;top:28%;background:rgba(212,175,55,.08);animation:orbFloat1 12s ease-in-out infinite}
#root::after{width:320px;height:320px;right:-150px;top:58%;background:rgba(255,255,255,.035);animation:orbFloat2 16s ease-in-out infinite}
.product-card{position:relative;overflow:hidden;border-color:rgba(212,175,55,.13)!important;box-shadow:0 10px 35px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035)!important;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .45s}
.product-card::before{content:"";position:absolute;inset:-120% 35% -120% -35%;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.10) 48%,rgba(212,175,55,.08) 51%,transparent 63%);transform:translateX(-65%) rotate(8deg);pointer-events:none;z-index:2;transition:transform 1.2s ease}
.product-card:hover::before{transform:translateX(115%) rotate(8deg)}
.product-card:hover{transform:translateY(-6px) scale(1.008);border-color:rgba(212,175,55,.32)!important;box-shadow:0 22px 55px rgba(0,0,0,.34),0 0 30px rgba(212,175,55,.06),inset 0 1px 0 rgba(255,255,255,.06)!important}
.category-chip{transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease,background .3s ease}
.category-chip:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(212,175,55,.10)}
header{animation:luxuryEnter 1s cubic-bezier(.2,.75,.2,1) both}
@keyframes luxuryDrift{0%{transform:translate3d(-1.5%,-1%,0) scale(1)}50%{transform:translate3d(1%,1.5%,0) scale(1.035)}100%{transform:translate3d(-.5%,2%,0) scale(1.02)}}
@keyframes luxuryShimmer{0%{background-position:0 0,0 0,0 0}100%{background-position:100% 0,70px 70px,-70px 70px}}
@keyframes orbFloat1{0%,100%{transform:translate(0,0)}50%{transform:translate(70px,-45px)}}
@keyframes orbFloat2{0%,100%{transform:translate(0,0)}50%{transform:translate(-60px,50px)}}
@keyframes luxuryEnter{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){body::before,body::after,#root::before,#root::after,header,.product-card::before{animation:none!important}.product-card,.category-chip{transition:none!important}}
@media(max-width:639px){body::after{opacity:.14}.product-card:hover{transform:none}.product-card::before{display:none}}

.category-chip{min-height:44px;display:inline-flex;align-items:center}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

    async function pdfLogoToTransparentDataURL(file) {
        validateUploadFile(file, { maxBytes: 8 * 1024 * 1024, types: ["image/jpeg", "image/png", "image/webp", "image/svg+xml"] });
        if (file.type.includes("svg")) {
            return await new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(String(r.result)); r.onerror = () => reject(r.error); r.readAsDataURL(file); });
        }
        const raw = await new Promise((resolve, reject) => { const r = new FileReader(); r.onload = () => resolve(r.result); r.onerror = () => reject(r.error); r.readAsDataURL(file); });
        const img = await new Promise((resolve, reject) => { const im = new Image(); im.onload = () => resolve(im); im.onerror = () => reject(new Error("Logo açılamadı")); im.src = raw; });
        const max = 1800, scale = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round((img.naturalWidth || img.width) * scale));
        c.height = Math.max(1, Math.round((img.naturalHeight || img.height) * scale));
        const ctx = c.getContext("2d", { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, c.width, c.height);
        const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data;
        for (let i = 0; i < px.length; i += 4) {
            const r = px[i], g = px[i + 1], b = px[i + 2], a = px[i + 3];
            const min = Math.min(r, g, b), maxc = Math.max(r, g, b);
            if (a > 0 && min > 238 && maxc - min < 18)
                px[i + 3] = 0;
            else if (a > 0 && min > 220 && maxc - min < 22)
                px[i + 3] = Math.round(a * ((255 - min) / 35));
        }
        ctx.putImageData(d, 0, 0);
        return c.toDataURL("image/png");
    }

    async function fileToOptimizedDataURL(file, maxSize = 1800, quality = .82) {
        validateUploadFile(file);
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(reader.error || new Error("Dosya okunamadı"));
            reader.onload = () => {
                const img = new Image();
                img.onerror = () => reject(new Error("Görsel açılamadı"));
                img.onload = () => {
                    const scale = Math.min(1, maxSize / Math.max(img.naturalWidth, img.naturalHeight));
                    const w = Math.max(1, Math.round(img.naturalWidth * scale));
                    const h = Math.max(1, Math.round(img.naturalHeight * scale));
                    const canvas = document.createElement("canvas");
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0, w, h);
                    resolve(canvas.toDataURL("image/jpeg", quality));
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });
    }

    async function tryUnlock() {
        const now = Date.now();
        if (now < pinBlockedUntil) {
            setPinError(true);
            const remaining = Math.max(1, Math.ceil((pinBlockedUntil - now) / 60000));
            showToast(`Çok fazla hatalı PIN denemesi. Yönetim girişi ${remaining} dakika boyunca kilitli.`);
            return;
        }
        if (pinBlockedUntil) {
            clearPinLock();
        }
        if (pinCheckBusy)
            return;
        const candidate = String(pinInput || "").replace(/\D/g, "").slice(0, 8);
        if (!isValidPin(candidate)) {
            setPinError(true);
            return;
        }
        /* Kademeli bekleme: her hatalı denemeden sonra doğrulama süresi uzar (brute-force'u yavaşlatır). */
        pinCheckBusy = true;
        try {
            await new Promise(r => setTimeout(r, Math.min(8000, 400 * Math.pow(2, pinFailureCount))));
        }
        finally {
            pinCheckBusy = false;
        }
        if (!hasAdminPin()) {
            /* İlk kurulum: bu cihaz için yönetim PIN'i belirlenir. */
            if (candidate === "1234") {
                showToast("Güvenlik için 1234 kullanılamaz. Farklı bir PIN seçin.");
                setPinError(true);
                return;
            }
            try {
                await setAdminPin(candidate);
            }
            catch (e) {
                showToast(e.message || "PIN kaydedilemedi.");
                return;
            }
            showToast("Yönetim PIN'i oluşturuldu.");
        }
        else {
            let ok = false;
            try {
                ok = await verifyAdminPin(candidate);
            }
            catch (e) {
                showToast(e.message || "PIN doğrulanamadı.");
                return;
            }
            if (!ok) {
                pinFailureCount++;
                persistPinLock();
                if (pinFailureCount >= SECURITY_LIMITS.pinAttempts) {
                    pinBlockedUntil = now + 60 * 60 * 1000;
                    persistPinLock();
                    showToast("3 hatalı PIN denemesi. Yönetim girişi 1 saat boyunca kilitlendi.");
                }
                else {
                    showToast(`Hatalı PIN. Kalan deneme: ${SECURITY_LIMITS.pinAttempts - pinFailureCount}`);
                }
                setPinError(true);
                return;
            }
        }
        clearPinLock();
        adminActivityRef.current = Date.now();
        setUnlocked(true);
        setPinModal(false);
        panelSnapshot.current = JSON.parse(JSON.stringify(data));
        setPanelOpen(true);
        setPinInput("");
    }

            return;
        }
        setPdfBusy(kind);

        const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "");
        try {
            /* Mobile browsers often ignore blob downloads triggered after an async
               operation. Open a user-initiated tab first, then navigate it to the PDF. */
            if (openPreview || isMobile)
                win = window.open("about:blank", "_blank");
            let blob, fileName;
            if (kind === "catalog") {
                /* Katalog: fiyatsız, sitenin seçili dilinde, yönetim panelinde seçilen şablonla. */
                const catLang = language === "EN" ? "EN" : "TR";

                blob = await buildPriceListPDF(pdfData, pdfLang);
                fileName = pdfCurrency === "TRY" ? "OFISCHI-2026-2-TL-FIYAT-LISTESI.pdf" : pdfCurrency === "USD" ? "OFISCHI-2026-2-USD-PRICE-LIST.pdf" : "OFISCHI-2026-2-EUR-PRICE-LIST.pdf";
            }
            if (!blob || blob.size <= 0)
                throw new Error("PDF doğrulaması başarısız: dosya boyutu 0.");
            if (blob.type !== "application/pdf")
                throw new Error("PDF doğrulaması başarısız: MIME type application/pdf değil.");
            const pdfBytes = new Uint8Array(await blob.arrayBuffer());
            pdfValidateBlobBytes(pdfBytes);
            const url = URL.createObjectURL(blob);
            if (openPreview || isMobile) {
                if (win) {
                    win.location.href = url;
                    try {
                        win.document.title = fileName;
                    }
                    catch (_) { }
                }
                else {
                    window.location.href = url;
                }
                /* Keep the object URL alive long enough for iOS/Android PDF viewers. */
                setTimeout(() => URL.revokeObjectURL(url), 180000);
                showToast(language === "EN" ? "PDF opened. Use Share/Save to save the file." : "PDF açıldı. Kaydetmek için Paylaş / Dosyalara Kaydet seçeneğini kullanın.");
            }
            else {
                const a = document.createElement("a");
                a.href = url;
                a.download = fileName;
                a.target = "_blank";
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 10000);
                showToast(language === "EN" ? "PDF created." : "PDF oluşturuldu.");
            }
        }
        catch (e) {
            console.error(e);
            if (win && !win.closed)
                try {
                    win.close();
                }
                catch (_) { }
            showToast("PDF oluşturulamadı: " + (e?.message || "PDF oluşturma hatası"));
        }
        finally {
            setPdfBusy(false);
