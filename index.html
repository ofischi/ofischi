<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect,useRef}=React;

/*
  OFISCHI PREMIUM
  - Supabase YOK
  - Veriler localStorage + IndexedDB'de tutulur
  - Mevcut katalog verisini silmez
  - İlk kullanımda mevcut katalog JSON'u içe aktarılabilir
  - İngilizce alanlar Türkçe alanlardan ayrı tutulur
*/

const DB_KEY="ofischi_premium_catalog_v4";
const BACKUP_KEY="ofischi_premium_catalog_backup_v4";
const LANG_KEY="ofischi_premium_lang_v1";
const CATS=[
"VIP Makam Takımları","Makam Takımları","Personel Takımları","Toplantı Masaları",
"Workstation","Loby Koltukları","Ofis Koltukları","Fileli Koltuklar","Aksesuarlar"
];
const CATEGORY_EN={
"VIP Makam Takımları":"VIP Executive Office Sets",
"Makam Takımları":"Executive Office Sets",
"Personel Takımları":"Staff Office Sets",
"Toplantı Masaları":"Meeting Tables",
"Workstation":"Workstations",
"Loby Koltukları":"Lobby Seating",
"Ofis Koltukları":"Office Chairs",
"Fileli Koltuklar":"Mesh Office Chairs",
"Aksesuarlar":"Accessories"
};
const THEMES=[
{id:"graphite",name:"Grafit",bg:"#141416",card:"#1D1E21",accent:"#C9A227",text:"#EDEDEF"},
{id:"walnut",name:"Ceviz",bg:"#F5F1EA",card:"#FFFFFF",accent:"#8B4A2B",text:"#2A2016"},
{id:"navy",name:"Lacivert",bg:"#F4F6FA",card:"#FFFFFF",accent:"#1E3A5F",text:"#101826"},
{id:"goldnight",name:"Antrasit Altın",bg:"#1B1B1F",card:"#242428",accent:"#D4AF37",text:"#F0EFEA"},
{id:"concrete",name:"Beton Gri",bg:"#EEEEEC",card:"#FFFFFF",accent:"#4A4A4A",text:"#1C1C1C"}
];
const CURRENCIES=[
{id:"TRY",symbol:"₺",name:"TL"},{id:"USD",symbol:"$",name:"USD"},{id:"EUR",symbol:"€",name:"EUR"}
];

function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36)}
function createCategory(name){return{id:uid(),name,name_en:CATEGORY_EN[name]||"",items:[]}}
function createDefaultCategories(){return CATS.map(createCategory)}
function defaultData(){return{
siteName:"Ofischi",siteName_en:"Ofischi",
subtitle:"Ofis Mobilyaları",subtitle_en:"Office Furniture",
eyebrow:"İNEGÖL ÜRETİM",eyebrow_en:"İNEGÖL PRODUCTION",
phone:"+90 500 000 00 00",pin:"1234",
logo:{src:"./ofischi_logo_transparent.png",size:110,width:110,height:110,position:"left"},
theme:{...THEMES[0],bgImage:null},cardImgSize:180,
currency:{selected:"TRY",usdRate:40,eurRate:47},
categories:createDefaultCategories(),language:"TR",
pdf:{title:"2026-2 TL FİYAT LİSTESİ",footer:"www.ofishci.com",showPageNumbers:true,website:"www.ofishci.com",useCategoryCovers:false,coverLogo:null}
}}
function normalizePrice(price){
if(!price)return{contactOnly:true,amount:null,parts:[]};
let parts=Array.isArray(price.parts)?price.parts.map(p=>({
id:p.id||uid(),name:typeof p.name==="string"?p.name:"Yeni Parça",
name_en:typeof p.name_en==="string"?p.name_en:"",
dims:typeof p.dims==="string"?p.dims:"",
dims_en:typeof p.dims_en==="string"?p.dims_en:"",
amount:p.amount===null||p.amount===undefined||p.amount===""?null:Number(p.amount),
contactOnly:!!p.contactOnly
})):[]; 
if(parts.length===0&&price.amount!==null&&price.amount!==undefined&&price.amount!=="")
parts.push({id:uid(),name:"Ürün",name_en:"Product",dims:"",dims_en:"",amount:Number(price.amount),contactOnly:!!price.contactOnly});
return{contactOnly:!!price.contactOnly&&parts.length===0,amount:price.amount??null,parts};
}
function normalizeItem(item){
item=item||{};
return{...item,id:item.id||uid(),
name:typeof item.name==="string"?item.name:"Yeni Ürün",
name_en:typeof item.name_en==="string"?item.name_en:"",
desc:typeof item.desc==="string"?item.desc:"",
desc_en:typeof item.desc_en==="string"?item.desc_en:"",
dims:typeof item.dims==="string"?item.dims:"",
dims_en:typeof item.dims_en==="string"?item.dims_en:"",
image:item.image||null,price:normalizePrice(item.price)}
}
function normalizeCategories(categories){
if(!Array.isArray(categories))return createDefaultCategories();
return categories.map(c=>({
...c,id:c.id||uid(),
name:typeof c.name==="string"?c.name:(c.name?.tr||"Yeni Kategori"),
name_en:typeof c.name_en==="string"?c.name_en:(CATEGORY_EN[c.name]||""),
items:Array.isArray(c.items)?c.items.map(normalizeItem):[],
coverImage:c.coverImage||null
}))
}
function normalizeData(input){
const base=defaultData();
if(!input||typeof input!=="object")return base;
const r={...base,...input};
/* Varsayılanlar yalnızca alan hiç yoksa uygulanır. Boş değerler kullanıcı tarafından silinebilir/değiştirilebilir. */
if(typeof r.siteName!=="string")r.siteName=base.siteName;
if(typeof r.siteName_en!=="string")r.siteName_en=base.siteName_en;
if(typeof r.subtitle!=="string")r.subtitle=base.subtitle;
if(typeof r.subtitle_en!=="string")r.subtitle_en=base.subtitle_en;
if(typeof r.eyebrow!=="string")r.eyebrow=base.eyebrow;
if(typeof r.eyebrow_en!=="string")r.eyebrow_en=base.eyebrow_en;
r.logo={...base.logo,...(input.logo||{})};
r.logo.size=Number(r.logo.size)||110;r.logo.width=Number(r.logo.width)||r.logo.size;r.logo.height=Number(r.logo.height)||r.logo.size;
r.theme={...base.theme,...(input.theme||{})};
r.currency={...base.currency,...(input.currency||{})};
r.pdf={...base.pdf,...(input.pdf||{})};
r.categories=normalizeCategories(input.categories);
r.language=input.language==="EN"?"EN":"TR";
return r;
}

/* -------------------- STORAGE -------------------- */
/*
  KALICI KAYIT SİSTEMİ
  - localStorage: hızlı ana kayıt
  - IndexedDB: ikinci kalıcı kayıt / kurtarma
  - Her kayda savedAt eklenir ve açılışta en güncel kayıt seçilir.
  - Sayfa yenilenirken pagehide/beforeunload son state'i de localStorage'a yazar.

  Bu sürüm sunucu veritabanı kullanmaz. Aynı tarayıcı + aynı domain/origin
  üzerinde veriler kalıcıdır. Cihazlar arasında ortak veri için backend gerekir.
*/
const IDB_NAME="ofischi_premium_storage_v2";
const IDB_STORE="catalog";
const IDB_KEY="catalog";

function openCatalogDB(){
  return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(new Error("IndexedDB desteklenmiyor"));return;}
    const req=indexedDB.open(IDB_NAME,1);
    req.onupgradeneeded=()=>{
      const db=req.result;
      if(!db.objectStoreNames.contains(IDB_STORE))db.createObjectStore(IDB_STORE);
    };
    req.onsuccess=()=>resolve(req.result);
    req.onerror=()=>reject(req.error||new Error("IndexedDB açılamadı"));
  });
}

function makeStorageRecord(data){
  return{savedAt:Date.now(),data:normalizeData(data)};
}

function parseStorageRecord(value){
  if(!value||typeof value!=="object")return null;
  /* Yeni format */
  if(value.data&&typeof value.data==="object")return{savedAt:Number(value.savedAt)||0,data:normalizeData(value.data)};
  /* Eski v4 formatıyla geriye dönük uyumluluk */
  return{savedAt:1,data:normalizeData(value)};
}

function readLocalRecord(key){
  try{
    const raw=localStorage.getItem(key);
    if(!raw)return null;
    return parseStorageRecord(JSON.parse(raw));
  }catch(e){
    console.warn("localStorage okunamadı:",e);
    return null;
  }
}

async function idbGetRecord(){
  const db=await openCatalogDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,"readonly");
    const req=tx.objectStore(IDB_STORE).get(IDB_KEY);
    req.onsuccess=()=>resolve(parseStorageRecord(req.result));
    req.onerror=()=>reject(req.error||new Error("IndexedDB okuma hatası"));
    tx.oncomplete=()=>db.close();
    tx.onerror=()=>reject(tx.error||new Error("IndexedDB işlem hatası"));
  });
}

async function idbSetRecord(record){
  const db=await openCatalogDB();
  return new Promise((resolve,reject)=>{
    const tx=db.transaction(IDB_STORE,"readwrite");
    tx.objectStore(IDB_STORE).put(record,IDB_KEY);
    tx.oncomplete=()=>{db.close();resolve(true)};
    tx.onerror=()=>{db.close();reject(tx.error||new Error("IndexedDB yazma hatası"))};
    tx.onabort=()=>{db.close();reject(tx.error||new Error("IndexedDB yazma iptal edildi"))};
  });
}

async function loadLocal(){
  const local=readLocalRecord(DB_KEY);
  const backup=readLocalRecord(BACKUP_KEY);
  let idb=null;
  try{idb=await idbGetRecord()}catch(e){console.warn("IndexedDB okunamadı:",e)}

  const candidates=[local,backup,idb].filter(Boolean);
  if(!candidates.length)return null;
  candidates.sort((a,b)=>(Number(b.savedAt)||0)-(Number(a.savedAt)||0));
  const newest=candidates[0];

  /* En güncel kopyayı diğer katmanlara da senkronla. */
  try{
    const json=JSON.stringify(newest);
    localStorage.setItem(DB_KEY,json);
    localStorage.setItem(BACKUP_KEY,json);
  }catch(e){}
  try{await idbSetRecord(newest)}catch(e){}

  return normalizeData(newest.data);
}

async function saveLocal(data){
  const clean=normalizeData(data);
  const record=makeStorageRecord(clean);
  const json=JSON.stringify(record);
  let localOk=false,idbOk=false;

  try{
    localStorage.setItem(DB_KEY,json);
    localStorage.setItem(BACKUP_KEY,json);
    /* Yazmayı hemen geri okuyarak gerçekten kaydedildiğini doğrula. */
    const check=readLocalRecord(DB_KEY);
    localOk=!!check&&check.savedAt===record.savedAt;
  }catch(e){console.warn("localStorage yazılamadı:",e)}

  try{
    await idbSetRecord(record);
    const check=await idbGetRecord();
    idbOk=!!check&&check.savedAt===record.savedAt;
  }catch(e){console.warn("IndexedDB yazılamadı:",e)}

  if(!localOk&&!idbOk)throw new Error("Tarayıcı depolamasına yazılamadı");
  return clean;
}

/* -------------------- SHARED PRICE ENGINE FOR PDF + WEB -------------------- */
function getCurrencyByData(source){
 const id=source?.currency?.selected||"TRY";
 return CURRENCIES.find(x=>x.id===id)||CURRENCIES[0];
}
function convertPriceByData(source,amount){
 if(amount===null||amount===undefined||amount==="")return null;
 const n=Number(amount),c=source?.currency?.selected||"TRY";
 if(!Number.isFinite(n))return null;
 if(c==="USD"){const r=Number(source?.currency?.usdRate);return r>0?n/r:null}
 if(c==="EUR"){const r=Number(source?.currency?.eurRate);return r>0?n/r:null}
 return n;
}
function formatAmountByData(source,amount){
 const v=convertPriceByData(source,amount);if(v===null)return null;
 const c=getCurrencyByData(source),d=c.id==="TRY"?0:2;
 const locale=c.id==="TRY"?"tr-TR":"en-US";
 const s=v.toLocaleString(locale,{minimumFractionDigits:d,maximumFractionDigits:d});
 return c.id==="USD"?"$"+s:c.id==="EUR"?"€"+s:s+" ₺";
}

   PDF LAYOUT — ORIGINAL OFISCHI GRID
   A4 portrait, fixed x coordinates, one identical product template.

function pdfMoney(data,amount){

function pdfTotal(data,item){

   return n>0?pdfMoney(data,n):(p.parts.some(x=>x.contactOnly)?(data?.currency?.selected==="TRY"?"İletişime geçin":"Contact us"):"—");
 }

function pdfImageSource(value){
 if(typeof value==="string")return value.trim();
 if(value&&typeof value==="object")return String(value.src||value.data||value.url||"").trim();
 return "";
}
function pdfValidProductId(item){
 const id=item?.id;

}
function pdfHasRealProductData(item){
 if(!item||typeof item!=="object")return false;

 const hasPrice=!!price&&(
   (Array.isArray(price.parts)&&price.parts.some(p=>p&&((p.amount!==null&&p.amount!==undefined&&p.amount!=="")||String(p.name??"").trim()))) ||
   (price.amount!==null&&price.amount!==undefined&&price.amount!=="")
 );

}
function pdfIsDemoProduct(item){
 if(!item||typeof item!=="object")return true;
 if(!pdfValidProductId(item))return true;
 if(item.isDemo===true||item.placeholder===true||item.temporary===true)return true;
 const name=String(item.name??"").trim();
 if(!name)return true;
 /* Only an empty legacy placeholder named Yeni Ürün/New Product is removed. */
 if(/^(yeni\s*ürün|new\s*product)$/i.test(name)&&!pdfHasRealProductData(item))return true;

 const logo=pdfImageSource(data?.logo?.src);
 if(logo&&src===logo)return "";
 for(const category of (data?.categories||[])){
   const cover=pdfImageSource(category?.coverImage);
   if(cover&&src===cover)return "";

function pdfRealCategories(rawData){
 const source=rawData&&typeof rawData==="object"?rawData:{};

 return categories.map(category=>{
   if(!category||typeof category!=="object")return null;
   const rawItems=Array.isArray(category.items)?category.items:[];
   const items=rawItems.filter(item=>!pdfIsDemoProduct(item)).map(item=>{
     const normalized=normalizeItem(item);
     /* One PDF product = one source item. No fields are borrowed from another item. */
     return {
       ...normalized,
       id:item.id,
       categoryId:category.id,
       categoryName:category.name,
       categoryName_en:category.name_en,
       image:pdfProductImageSource(item,source)||null
     };
   });
   return {...category,items};
 }).filter(Boolean).filter(category=>category.items.length>0);

async function buildPriceListPDF(rawData,lang){
 const source=normalizeData(rawData),currency=source.currency?.selected||"TRY";
 const pdfLang=currency==="TRY"?"TR":"EN";
 /* 1 currency/language  2 existing rates  3 real products  4 demo filter  5 images  6 layout */
 const prepared=await pdfPrepareImages(source),data=prepared.data,preparedImages=prepared.images;
 const pages=[await renderPdfCoverPage(data,pdfLang)];
 const L=PDF_LAYOUT,H=L.H,TOP=L.top,BOTTOM=L.bottom,GAP=L.gap,MAX_PRODUCTS=6;
 let current=[],used=TOP,productCount=0,currentCategoryId=null;
 const flush=async()=>{
   if(!current.length)return;
   pages.push(await renderPdfCatalogPage(data,pdfLang,current,pages.length+1,preparedImages));
   current=[];used=TOP;productCount=0;currentCategoryId=null;
 };
 const fits=h=>used+h<=H-BOTTOM;
 for(const category of (data.categories||[])){
   const items=Array.isArray(category.items)?category.items:[];
   if(!items.length)continue;
   const useCover=!!(data.pdf?.useCategoryCovers&&category.coverImage);
   const coverH=46;
   /* Category header belongs naturally before the first product, but never causes a giant blank area. */
   let headerNeed=L.categoryH+GAP;
   if(useCover)headerNeed+=coverH+GAP;
   if(current.length&&(!fits(headerNeed+pdfCardHeight(items[0]))||productCount>=MAX_PRODUCTS))await flush();
   if(useCover){
     if(!fits(coverH+GAP))await flush();
     current.push({type:"categoryCover",category});used+=coverH+GAP;
   }
   if(!fits(L.categoryH+GAP)&&current.length)await flush();
   current.push({type:"category",category});used+=L.categoryH+GAP;currentCategoryId=category.id;
   for(const item of items){
     const h=pdfCardHeight(item);
     if(productCount>=MAX_PRODUCTS||!fits(h)){
       await flush();
       current.push({type:"category",category});used+=L.categoryH+GAP;currentCategoryId=category.id;
     }
     current.push({type:"product",category,item});used+=h+GAP;productCount++;
   }
 }
 await flush();
 return await pdfCreateVectorDocument(pages);
}

async function pdfCreateVectorDocument(pages){
 const objs=[];const add=b=>{objs.push(b);return objs.length};
 const usedTexts=[];for(const p of pages)usedTexts.push(p.content);const usedCids=pdfCollectUsedCids(usedTexts);const fontObj=await pdfMakeFontAndToUnicode(objs,usedCids);
 const pageRefs=[];
 for(const page of pages){
  const imageRefs=[];const imageMap=new Map();
  for(const asset of page.images.values()){
   const bytes=pdfDataUriToBytes(asset.data);const io=add(pdfConcatBytes([pdfObjBytes(`<< /Type /XObject /Subtype /Image /Width ${asset.width} /Height ${asset.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`),bytes,pdfObjBytes("\nendstream")]));imageRefs.push({id:asset.id,obj:io});imageMap.set(asset.id,io);
  }
  let res=`/Font << /F1 ${fontObj} 0 R >>`;if(imageRefs.length)res+=` /XObject << ${imageRefs.map(r=>`/Im${r.id} ${r.obj} 0 R`).join(" ")} >>`;
  const contentBytes=pdfObjBytes(page.content);const co=add(pdfConcatBytes([pdfObjBytes(`<< /Length ${contentBytes.length} >>\nstream\n`),contentBytes,pdfObjBytes("\nendstream")]));
  const po=add(pdfObjBytes(`<< /Type /Page /Parent PAGESREF /MediaBox [0 0 595.28 841.89] /Resources << ${res} >> /Contents ${co} 0 R >>`));pageRefs.push(po);
 }
 const pagesObj=add(pdfObjBytes(`<< /Type /Pages /Kids [${pageRefs.map(n=>n+" 0 R").join(" ")}] /Count ${pageRefs.length} >>`));const catalog=add(pdfObjBytes(`<< /Type /Catalog /Pages ${pagesObj} 0 R /PageMode /UseNone >>`));
 for(const n of pageRefs){objs[n-1]=pdfObjBytes(new TextDecoder().decode(objs[n-1]).replace("PAGESREF",`${pagesObj} 0 R`))}
 const header=pdfObjBytes("%PDF-1.4\n%\xFF\xFF\xFF\xFF\n");const parts=[header],offsets=[0];let pos=header.length;
 for(let i=0;i<objs.length;i++){const head=pdfObjBytes(`${i+1} 0 obj\n`),tail=pdfObjBytes("\nendobj\n");offsets[i+1]=pos;parts.push(head,objs[i],tail);pos+=head.length+objs[i].length+tail.length}
 const xrefPos=pos;let xref=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;for(let i=1;i<=objs.length;i++)xref+=String(offsets[i]).padStart(10,"0")+" 00000 n \n";xref+=`trailer\n<< /Size ${objs.length+1} /Root ${catalog} 0 R >>\nstartxref\n${xrefPos}\n%%EOF`;parts.push(pdfObjBytes(xref));return new Blob([pdfConcatBytes(parts)],{type:"application/pdf"});
}

async function fileToOptimizedDataURL(file,maxSize=1800,quality=.82){
  if(!file||!file.type.startsWith("image/"))throw new Error("Geçersiz görsel");
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onerror=()=>reject(reader.error||new Error("Dosya okunamadı"));
    reader.onload=()=>{
      const img=new Image();
      img.onerror=()=>reject(new Error("Görsel açılamadı"));
      img.onload=()=>{
        const scale=Math.min(1,maxSize/Math.max(img.naturalWidth,img.naturalHeight));
        const w=Math.max(1,Math.round(img.naturalWidth*scale));
        const h=Math.max(1,Math.round(img.naturalHeight*scale));
        const canvas=document.createElement("canvas");canvas.width=w;canvas.height=h;
        const ctx=canvas.getContext("2d");ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL("image/jpeg",quality));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

<label className="block mb-4"><AdminLabel>Üst Etiket</AdminLabel><input className="admin-input" value={data.eyebrow??""} onChange={e=>editGeneralTurkishField("eyebrow",e.target.value)} /></label>
<label className="block mb-5"><AdminLabel>{t("TR","phone")}</AdminLabel><input className="admin-input" value={data.phone||""} onChange={e=>setPath(["phone"],e.target.value)} placeholder="+90 5xx xxx xx xx"/></label>

<div className="h-px bg-neutral-800 my-5"/>
<div className="text-[10px] font-bold uppercase tracking-widest text-amber-500 mb-3">Premium Logo</div>
<div className="bg-neutral-900 rounded-xl p-4 mb-5">
<div className="rounded-xl bg-neutral-800 min-h-[120px] flex items-center justify-center mb-3 overflow-hidden">
{data.logo.src?<img src={data.logo.src} alt="Logo" style={{width:Math.min(data.logo.width||110,260),height:Math.min(data.logo.height||110,140),maxWidth:"90%",objectFit:"contain"}}/>:<div className="text-xs text-neutral-500">Logo eklenmedi</div>}
</div>
<div className="grid grid-cols-2 gap-2 mb-3">
<button onClick={()=>document.getElementById("local-logo-input")?.click()} className="py-2.5 rounded-lg bg-neutral-800 border border-neutral-700 text-xs font-bold flex items-center justify-center gap-2"><Icon type="upload" size={14}/>Logo Ekle / Değiştir</button>
<button disabled={!data.logo.src} onClick={removeLogo} className="py-2.5 rounded-lg bg-red-950 text-red-400 text-xs font-bold disabled:opacity-30">Logo Sil</button>
</div>
<input id="local-logo-input" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" className="hidden" onChange={uploadLogoLocal}/>
<div className="grid grid-cols-2 gap-3">
<label><AdminLabel>Logo Genişliği — {data.logo.width||110}px</AdminLabel><input type="range" min="40" max="360" value={data.logo.width||110} onChange={e=>setPath(["logo","width"],Number(e.target.value))} className="w-full"/></label>
<label><AdminLabel>Logo Yüksekliği — {data.logo.height||110}px</AdminLabel><input type="range" min="40" max="220" value={data.logo.height||110} onChange={e=>setPath(["logo","height"],Number(e.target.value))} className="w-full"/></label>
</div>
<div className="mt-4"><AdminLabel>Logo Konumu</AdminLabel><div className="grid grid-cols-3 gap-2">{[["left","Sol"],["center","Orta"],["right","Sağ"]].map(([v,l])=><button key={v} onClick={()=>setPath(["logo","position"],v)} className="py-2 rounded-lg text-xs font-semibold" style={{background:data.logo.position===v?theme.accent:"#1c1c1c",color:"#fff"}}>{l}</button>)}</div></div>
</div>
<div className="bg-neutral-900 rounded-xl p-4 mb-5">
<div className="text-[10px] uppercase tracking-widest font-bold text-amber-500 mb-3">Katalog Yedekleme</div>
<div className="grid grid-cols-2 gap-2">
<button onClick={()=>downloadJSON(data)} className="py-2.5 rounded-lg text-xs font-bold bg-neutral-800 flex items-center justify-center gap-2"><Icon type="download" size={14}/>{t("TR","exportJSON")}</button>
<button onClick={()=>importRef?.click()} className="py-2.5 rounded-lg text-xs font-bold bg-neutral-800 flex items-center justify-center gap-2"><Icon type="upload" size={14}/>{t("TR","importJSON")}</button>
</div>
<input ref={setImportRef} type="file" accept="application/json,.json" className="hidden" onChange={handleImport}/>
</div>

<div className="h-px bg-neutral-800 my-5"/>
<div className="text-[10px] font-bold uppercase tracking-widest text-amber-500 mb-3">Hazır Temalar</div>
<div className="grid grid-cols-3 gap-2 mb-5">{THEMES.map(tt=><button key={tt.id} onClick={()=>updateData(x=>{x.theme={...x.theme,bg:tt.bg,card:tt.card,accent:tt.accent,text:tt.text}})} className="rounded-xl overflow-hidden border-2" style={{borderColor:theme.bg===tt.bg&&theme.accent===tt.accent?tt.accent:"#292524"}}><div style={{height:35,background:tt.bg,display:"flex",alignItems:"center",justifyContent:"center"}}><span style={{width:15,height:15,borderRadius:"50%",background:tt.accent}}/></div><div className="bg-neutral-900 py-1 text-[9px]">{tt.name}</div></button>)}</div>
<ColorInput label="Arka Plan Rengi" value={theme.bg} onChange={v=>setPath(["theme","bg"],v)}/>
<ColorInput label="Kart Rengi" value={theme.card} onChange={v=>setPath(["theme","card"],v)}/>
<ColorInput label="Vurgu Rengi" value={theme.accent} onChange={v=>setPath(["theme","accent"],v)}/>
<ColorInput label="Yazı Rengi" value={theme.text} onChange={v=>setPath(["theme","text"],v)}/>
<AdminLabel>Ürün Görsel Yüksekliği — {data.cardImgSize}px</AdminLabel>
<input type="range" min="100" max="320" value={data.cardImgSize} onChange={e=>setPath(["cardImgSize"],Number(e.target.value))} className="w-full mb-5"/>
<AdminLabel>Yönetim PIN</AdminLabel><input className="admin-input mb-5" value={data.pin||""} inputMode="numeric" maxLength="8" onChange={e=>setPath(["pin"],e.target.value.replace(/\D/g,""))} style={{letterSpacing:".3em"}}/>
<button onClick={resetDefault} className="w-full py-2.5 bg-neutral-900 border border-neutral-700 rounded-lg text-xs text-red-400">Varsayılan Ayarlara Dön</button>

</div><div className={adminSection==="fiyat"?"":"hidden"}><div className="h-px bg-neutral-800 my-5"/>
<div className="text-[10px] font-bold uppercase tracking-widest text-amber-500 mb-3">{t("TR","currency")}</div>
<div className="bg-neutral-900 rounded-xl p-4 mb-5">
<div className="text-xs text-neutral-400 mb-3">Fiyatlar TL olarak girilir. Kur değerleri manuel belirlenir.</div>
<div className="grid grid-cols-3 gap-2 mb-4">{CURRENCIES.map(c=><button key={c.id} onClick={()=>setPath(["currency","selected"],c.id)} className="py-2.5 rounded-lg text-xs font-bold" style={{background:currency.id===c.id?theme.accent:"#171717",color:currency.id===c.id?"#fff":"#999",border:"1px solid "+(currency.id===c.id?theme.accent:"#333")}}>{c.symbol} {c.name}</button>)}</div>
<label className="block mb-3"><AdminLabel>1 USD = Kaç TL?</AdminLabel><input type="number" step="0.01" className="admin-input" value={data.currency.usdRate} onChange={e=>setPath(["currency","usdRate"],e.target.value)}/></label>
<label className="block"><AdminLabel>1 EUR = Kaç TL?</AdminLabel><input type="number" step="0.01" className="admin-input" value={data.currency.eurRate} onChange={e=>setPath(["currency","eurRate"],e.target.value)}/></label>
</div>

</div><div className={adminSection==="katalog"?"":"hidden"}><div id="catalog-tab" className="mt-8 pt-6 border-t border-neutral-800">
<div className="mb-4 rounded-xl p-3" style={{background:theme.accent+"12",border:"1px solid "+theme.accent+"25"}}><div className="text-[10px] uppercase tracking-widest opacity-50">Şu anda düzenleniyor</div><div className="font-bold mt-1" style={{color:theme.accent}}>Premium Mağaza</div><div className="text-[10px] opacity-40 mt-1">Mevcut ürünler korunur.</div></div>
<button onClick={addCategory} className="w-full py-3 rounded-xl text-sm font-bold text-white mb-4 flex items-center justify-center gap-2" style={{background:theme.accent}}><Icon type="plus" size={17}/>{t("TR","newCategory")}</button>

{categories.map((category,categoryIndex)=><div key={category.id} className="bg-neutral-900 border border-neutral-800 rounded-xl mb-3 overflow-hidden">
<div className="p-2 flex items-center gap-1.5">
<input value={category.name} onChange={e=>renameCategory(category.id,e.target.value)} className="admin-input" style={{padding:"9px 10px",fontSize:"13px"}}/>
<button onClick={()=>moveCategory(category.id,-1)} disabled={categoryIndex===0} className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"><Icon type="up" size={14}/></button>
<button onClick={()=>moveCategory(category.id,1)} disabled={categoryIndex===categories.length-1} className="p-2 bg-neutral-800 rounded-lg disabled:opacity-20"><Icon type="down" size={14}/></button>
<button onClick={()=>deleteCategory(category.id)} className="p-2 bg-red-950 text-red-400 rounded-lg"><Icon type="trash" size={14}/></button>
<button onClick={()=>toggleCategory(category.id)} className="px-3 py-2 rounded-lg text-[11px] whitespace-nowrap flex items-center gap-1.5 font-semibold" style={{background:openCategories[category.id]?theme.accent:"#262626",color:openCategories[category.id]?"#fff":"#aaa"}}>{t("TR","productsBtn")}<Icon type={openCategories[category.id]?"up":"down"} size={13}/></button>
</div>

{openCategories[category.id]&&<div className="p-2 pt-0">
{category.items.length===0&&<div className="bg-neutral-800 rounded-xl p-4 mb-2 text-center text-xs text-neutral-500">Bu kategoride henüz ürün yok.</div>}
{category.items.map((item,itemIndex)=><div key={item.id} className="bg-neutral-800 rounded-xl p-3 mb-2">
<div className="flex gap-2 mb-2">
<div className="w-16 h-16 rounded-lg bg-neutral-700 flex-shrink-0 overflow-hidden flex items-center justify-center" style={{backgroundImage:item.image?`url(${item.image})`:undefined,backgroundSize:"cover",backgroundPosition:"center"}}>{!item.image&&<Icon type="image" size={18}/>}</div>
<div className="flex flex-col gap-1 flex-shrink-0">
<button type="button" onClick={()=>document.getElementById("product-image-"+category.id+"-"+item.id)?.click()} className="px-2.5 py-1.5 rounded-lg bg-neutral-700 border border-neutral-600 text-[10px] font-bold flex items-center gap-1"><Icon type="upload" size={12}/>Fotoğraf</button>
{item.image&&<button type="button" onClick={()=>removeProductImage(category.id,item.id)} className="px-2.5 py-1.5 rounded-lg bg-red-950 text-red-400 text-[10px] font-bold">Sil</button>}
<input id={"product-image-"+category.id+"-"+item.id} type="file" accept="image/*" className="hidden" onChange={e=>uploadProductImage(category.id,item.id,e)}/>
</div>
<div className="flex-1 grid gap-2">
<div>
<input value={item.name} onChange={e=>editTurkishField(category.id,item,"name",e.target.value)} placeholder="Ürün adı" className="admin-input" style={{padding:"8px 9px",fontSize:"12px"}}/>
</div>
<div>
<input value={item.dims} onChange={e=>{const v=e.target.value;updateItem(category.id,item.id,"dims",v);updateItem(category.id,item.id,"dims_en",v)}} placeholder={t("TR","dimsPlaceholder")} className="admin-input" style={{padding:"8px 9px",fontSize:"12px"}}/>
</div>
</div></div>

<div className="mb-2">
<textarea value={item.desc} onChange={e=>editTurkishField(category.id,item,"desc",e.target.value)} placeholder={t("TR","description")} className="admin-input"/>
</div>

<div className="rounded-xl border border-neutral-700 bg-neutral-900 p-3 mb-2">
<div className="flex items-center justify-between mb-3"><div><div className="text-[10px] uppercase tracking-widest font-bold" style={{color:theme.accent}}>{t("TR","parts")}</div><div className="text-[9px] text-neutral-500 mt-1">{t("TR","partHint")}</div></div><button onClick={()=>addPricePart(category.id,item.id)} className="px-3 py-1.5 rounded-lg text-[10px] font-bold text-white flex items-center gap-1" style={{background:theme.accent}}><Icon type="plus" size={12}/>{t("TR","addPrice")}</button></div>
{normalizePrice(item.price).parts.length===0&&<div className="text-[10px] text-neutral-500 py-2 text-center">Henüz fiyat kalemi eklenmedi.</div>}
{normalizePrice(item.price).parts.map(part=><div key={part.id} className="bg-neutral-800 rounded-lg p-2 mb-2">
<div className="mb-2">
<input value={part.name} onChange={e=>updatePricePart(category.id,item.id,part.id,"name",e.target.value)} placeholder="Parça adı" className="admin-input" style={{padding:"8px",fontSize:"11px"}}/>
</div>
<div className="grid grid-cols-[1fr_105px_auto] gap-2 items-center">
<input value={part.dims||""} onChange={e=>{const v=e.target.value;updatePricePart(category.id,item.id,part.id,"dims",v);updatePricePart(category.id,item.id,part.id,"dims_en",v)}} placeholder="Ölçü" className="admin-input" style={{padding:"8px",fontSize:"11px"}}/>
<input type="number" value={part.amount??""} disabled={part.contactOnly} onChange={e=>updatePricePart(category.id,item.id,part.id,"amount",e.target.value===""?null:Number(e.target.value))} placeholder="₺" className="admin-input" style={{padding:"8px",fontSize:"11px",opacity:part.contactOnly?.4:1}}/>
<button onClick={()=>deletePricePart(category.id,item.id,part.id)} className="px-2 py-2 bg-red-950 text-red-400 rounded-lg"><Icon type="trash" size={13}/></button>
</div>
<label className="flex items-center gap-2 mt-2 text-[10px] text-neutral-400"><input type="checkbox" checked={!!part.contactOnly} onChange={e=>updatePricePart(category.id,item.id,part.id,"contactOnly",e.target.checked)}/>{t("TR","contactOnly")}</label>
</div>)}
</div>

<div className="flex justify-end gap-1">
<button onClick={()=>moveItem(category.id,item.id,-1)} disabled={itemIndex===0} className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"><Icon type="up" size={12}/></button>
<button onClick={()=>moveItem(category.id,item.id,1)} disabled={itemIndex===category.items.length-1} className="p-1.5 bg-neutral-700 rounded disabled:opacity-20"><Icon type="down" size={12}/></button>
<button onClick={()=>deleteItem(category.id,item.id)} className="p-1.5 bg-red-950 text-red-400 rounded"><Icon type="trash" size={12}/></button>
</div>
</div>)}
<button onClick={()=>addItem(category.id)} className="w-full py-2.5 bg-neutral-700 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5"><Icon type="plus" size={14}/>{t("TR","addProduct")}</button>
</div>}
</div>)}
</div>
</div>


<div className={adminSection==="pdf"?"":"hidden"}>
<div className="mt-2 rounded-2xl border border-neutral-800 bg-neutral-900 p-4">
<div className="text-[10px] uppercase tracking-widest font-bold text-amber-500 mb-2">PDF Fiyat Listesi</div>
<div className="text-xs text-neutral-400 mb-4">Web sitesindeki kategori, ürün, görsel, ölçü, fiyat, dil ve para birimi sırası aynen PDF'ye aktarılır. KG ve M³ kullanılmaz.</div>
<div className="grid grid-cols-2 gap-2 mb-4">
<button onClick={()=>createPDF(false)} disabled={pdfBusy} className="py-3 rounded-xl text-xs font-bold text-white flex items-center justify-center gap-2 disabled:opacity-50" style={{background:theme.accent}}><Icon type="download" size={14}/>{pdfBusy?"Oluşturuluyor…":"PDF Oluştur"}</button>
<button onClick={()=>createPDF(true)} disabled={pdfBusy} className="py-3 rounded-xl text-xs font-bold bg-neutral-800 border border-neutral-700 flex items-center justify-center gap-2 disabled:opacity-50"><Icon type="image" size={14}/>PDF Önizle</button>
</div>
<div className="grid grid-cols-2 gap-3 mb-4">
<label><AdminLabel>PDF Başlığı</AdminLabel><input className="admin-input" value={data.pdf?.title||""} onChange={e=>setPath(["pdf","title"],e.target.value)}/></label>
<label><AdminLabel>Web Sitesi</AdminLabel><input className="admin-input" value={data.pdf?.website||""} onChange={e=>setPath(["pdf","website"],e.target.value)}/></label>
</div>
<label className="block mb-4"><AdminLabel>PDF Alt Bilgisi</AdminLabel><input className="admin-input" value={data.pdf?.footer||""} onChange={e=>setPath(["pdf","footer"],e.target.value)}/></label>
<label className="flex items-center gap-2 text-xs text-neutral-300 mb-5"><input type="checkbox" checked={data.pdf?.showPageNumbers!==false} onChange={e=>setPath(["pdf","showPageNumbers"],e.target.checked)}/> Sayfa numarası göster</label>
<label className="flex items-center gap-2 text-xs text-neutral-300 mb-5"><input type="checkbox" checked={!!data.pdf?.useCategoryCovers} onChange={e=>setPath(["pdf","useCategoryCovers"],e.target.checked)}/> Kategori kapak görsellerini PDF içinde kompakt banner olarak kullan</label>
<div className="border-t border-neutral-800 pt-4 mb-5">
<div className="text-[10px] uppercase tracking-widest font-bold text-amber-500 mb-2">PDF Kapak Logosu</div>
<div className="text-[10px] text-neutral-500 mb-3">Bu logo sadece PDF'nin ilk kapağında kullanılır. Web sitesindeki logo ve ürün görsellerinden bağımsızdır.</div>
<div className="h-32 rounded-lg bg-black border border-neutral-800 overflow-hidden flex items-center justify-center mb-3">{data.pdf?.coverLogo?.src?<img src={data.pdf.coverLogo.src} alt="PDF Kapak Logosu" className="max-w-[90%] max-h-[90%] object-contain"/>:<span className="text-[10px] text-neutral-600">PDF KAPAK LOGOSU EKLENMEDİ</span>}</div>
<div className="grid grid-cols-2 gap-2">
<button onClick={()=>document.getElementById("pdf-cover-logo-input")?.click()} className="py-2.5 rounded-lg bg-neutral-800 border border-neutral-700 text-[10px] font-bold">{data.pdf?.coverLogo?.src?"Logoyu Değiştir":"Logo Ekle"}</button>
<button disabled={!data.pdf?.coverLogo?.src} onClick={removePdfCoverLogo} className="py-2.5 rounded-lg bg-red-950 text-red-400 text-[10px] font-bold disabled:opacity-30">Logoyu Sil</button>
</div>
<input id="pdf-cover-logo-input" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" className="hidden" onChange={uploadPdfCoverLogo}/>
</div>
<div className="border-t border-neutral-800 pt-4">
<div className="text-[10px] uppercase tracking-widest font-bold text-amber-500 mb-3">Kategori Kapakları</div>
<div className="text-[10px] text-neutral-500 mb-3">Kapak görselleri ayrı tutulur. İstersen PDF içinde tam sayfa açmadan kompakt kategori bannerı olarak kullanılabilir.</div>
{categories.map(category=><div key={category.id} className="rounded-xl bg-neutral-950 border border-neutral-800 p-3 mb-3">
<div className="flex items-center justify-between gap-3 mb-3"><div className="font-semibold text-sm">{category.name}</div><div className="text-[10px] text-neutral-500">{category.items?.length||0} ürün</div></div>
<div className="h-28 rounded-lg bg-neutral-900 overflow-hidden flex items-center justify-center mb-3">{category.coverImage?<img src={category.coverImage} alt="Kapak" className="w-full h-full object-cover"/>:<span className="text-[10px] text-neutral-600">Kapak görseli yok</span>}</div>
<div className="grid grid-cols-3 gap-2">
<button onClick={()=>document.getElementById("cover-image-"+category.id)?.click()} className="py-2 rounded-lg bg-neutral-800 text-[10px] font-bold">{category.coverImage?"Değiştir":"Kapak Yükle"}</button>
<button disabled={!category.coverImage} onClick={()=>category.coverImage&&window.open(category.coverImage,"_blank")} className="py-2 rounded-lg bg-neutral-800 text-[10px] font-bold disabled:opacity-30">Önizle</button>
<button disabled={!category.coverImage} onClick={()=>removeCategoryCover(category.id)} className="py-2 rounded-lg bg-red-950 text-red-400 text-[10px] font-bold disabled:opacity-30">Sil</button>
</div>
<input id={"cover-image-"+category.id} type="file" accept="image/*" className="hidden" onChange={e=>uploadCategoryCover(category.id,e)}/>
</div>)}
</div>
</div>
</div>

<div className="sticky bottom-0 bg-neutral-950 border-t border-neutral-800 p-4"><button onClick={save} disabled={saving} className="w-full py-3.5 rounded-xl text-sm font-bold text-white flex items-center justify-center gap-2 disabled:opacity-50" style={{background:saved?"#12B76A":theme.accent,animation:saved?"pop .3s ease":saving?"none":"pulse 2.2s infinite"}}>{saved?<Icon type="check" size={17}/>:<Icon type="save" size={17}/>} {saved?t("TR","saved"):saving?t("TR","saving"):t("TR","save")}</button></div></div>
</aside></div>}

</div>
}
const root=document.getElementById("root");
if(root)ReactDOM.createRoot(root).render(<App/>);
</script>
</body>
</html>
