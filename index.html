/* RESPONSIVE / MOBILE / TABLET / DESKTOP */
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{min-width:320px;overscroll-behavior-x:none;touch-action:pan-y}
button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}
.safe-top{padding-top:env(safe-area-inset-top)}
.safe-bottom{padding-bottom:env(safe-area-inset-bottom)}
.product-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

}

/* LUXURY ANIMATED BACKGROUND - VISUAL ONLY */
body{position:relative;background:#0b0c0f!important;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-25%;z-index:-3;pointer-events:none;background:radial-gradient(circle at 18% 18%,rgba(212,175,55,.13),transparent 24%),radial-gradient(circle at 82% 28%,rgba(255,255,255,.055),transparent 22%),radial-gradient(circle at 52% 88%,rgba(212,175,55,.08),transparent 28%),linear-gradient(135deg,#08090b 0%,#14151a 48%,#090a0c 100%);animation:luxuryDrift 18s ease-in-out infinite alternate}

.product-card{position:relative;overflow:hidden;border-color:rgba(212,175,55,.13)!important;box-shadow:0 10px 35px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.035)!important;transition:transform .45s cubic-bezier(.2,.8,.2,1),box-shadow .45s,border-color .45s}
.product-card::before{content:"";position:absolute;inset:-120% 35% -120% -35%;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.10) 48%,rgba(212,175,55,.08) 51%,transparent 63%);transform:translateX(-65%) rotate(8deg);pointer-events:none;z-index:2;transition:transform 1.2s ease}
.product-card:hover::before{transform:translateX(115%) rotate(8deg)}
.product-card:hover{transform:translateY(-6px) scale(1.008);border-color:rgba(212,175,55,.32)!important;box-shadow:0 22px 55px rgba(0,0,0,.34),0 0 30px rgba(212,175,55,.06),inset 0 1px 0 rgba(255,255,255,.06)!important}
.category-chip{transition:transform .3s ease,box-shadow .3s ease,border-color .3s ease,background .3s ease}

header{animation:luxuryEnter 1s cubic-bezier(.2,.75,.2,1) both}
@keyframes luxuryDrift{0%{transform:translate3d(-1.5%,-1%,0) scale(1)}50%{transform:translate3d(1%,1.5%,0) scale(1.035)}100%{transform:translate3d(-.5%,2%,0) scale(1.02)}}

<script>
const { useState, useEffect, useRef, useDeferredValue } = React;
/*
  OFISCHI PREMIUM
  - Katalog verisi bu cihazda tutulur (localStorage + IndexedDB)
  - Görseller katalog verisinin içinde saklanır
  - Yönetim PIN'i katalog verisinde DEĞİL; ayrı bir anahtarda PBKDF2 hash olarak tutulur
  - İngilizce alanlar Türkçe alanlardan ayrı tutulur
*/
const DB_KEY = "ofischi_premium_catalog_v4";
/* Tarayıcı depolaması engelliyse (gizli mod, kapalı çerezler) site çökmesin. */
function lsGet(k) { try {
    return window.localStorage.getItem(k);
}
catch (_) {
    return null;
} }
function lsSet(k, v) { try {
    window.localStorage.setItem(k, v);
    return true;
}
catch (_) {
    return false;
} }
function lsRemove(k) { try {
    window.localStorage.removeItem(k);
}
catch (_) { } }
/* -------------------- SECURITY: INPUT DEFENSE / THROTTLING -------------------- */
const SECURITY_LIMITS = Object.freeze({
    text: 4000, shortText: 500, search: 120, id: 160, jsonFileBytes: 200 * 1024 * 1024,
    imageBytes: 15 * 1024 * 1024, imageCount: 20, apiWindowMs: 60 * 1000,
    apiCallsPerWindow: 30, pinAttempts: 3, assetUrl: 2048

    const s = String(value ?? "").trim();
    if (!s)

    if (/^data:image\/(?:png|jpe?g|webp|gif|svg\+xml);/i.test(s))
        return s;
    if (/^blob:/i.test(s))
        return s;
    if (s.length > SECURITY_LIMITS.assetUrl && !/^data:/i.test(s))

                return;

                }
